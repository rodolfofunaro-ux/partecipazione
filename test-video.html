<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Test streaming video protetto</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  margin:0;
  padding:24px;
  color:#222;
}

.box{
  max-width:620px;
  margin:40px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 8px 30px rgba(0,0,0,.10);
}

h1{
  font-size:22px;
  margin-top:0;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  font-size:16px;
  border:1px solid #bbb;
  border-radius:8px;
}

button{
  margin-top:14px;
  padding:12px 18px;
  font-size:16px;
  font-weight:700;
  border:0;
  border-radius:8px;
  cursor:pointer;
}

#esito{
  margin-top:18px;
  padding:14px;
  border-radius:8px;
  background:#f1f1f1;
  white-space:pre-wrap;
  word-break:break-word;
}

#areaVideo{
  display:none;
  margin-top:18px;
}

#videoTest{
  display:block;
  width:100%;
  max-height:70vh;
  background:#000;
  border-radius:12px;
}

.nota{
  font-size:13px;
  color:#666;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="box">

  <h1>Test streaming video protetto</h1>

  <p>
    Inserisci il token della famiglia di prova.
    Non viene memorizzato dalla pagina.
  </p>

  <input
    id="token"
    type="password"
    autocomplete="off"
    spellcheck="false"
    placeholder="Token famiglia"
  >

  <button id="test">
    Autorizza e carica video
  </button>

  <div id="esito">
    In attesa del test.
  </div>

  <div id="areaVideo">
    <video
      id="videoTest"
      controls
      playsinline
      preload="metadata"
    ></video>
  </div>

  <div class="nota">
    Pagina temporanea di collaudo.
    Nessun secret e nessun URL permanente del video sono contenuti nel file.
  </div>

</div>


<script>

// test-video.html — VERSIONE 2.0
// Autorizzazione + streaming R2 privato tramite URL temporaneo firmato.

const WORKER_URL =
  "https://partecipazione-test.rodolfo-funaro.workers.dev/";


const bottone =
  document.getElementById("test");

const tokenInput =
  document.getElementById("token");

const esito =
  document.getElementById("esito");

const areaVideo =
  document.getElementById("areaVideo");

const video =
  document.getElementById("videoTest");


function resetVideo() {

  try {
    video.pause();
  }
  catch (e) {}

  video.removeAttribute("src");
  video.load();

  areaVideo.style.display =
    "none";

}


bottone.addEventListener(
  "click",
  async () => {

    const token =
      tokenInput.value.trim();


    resetVideo();


    if (token.length < 32) {

      esito.textContent =
        "TOKEN NON VALIDO: troppo corto.";

      return;

    }


    bottone.disabled =
      true;

    esito.textContent =
      "Verifica autorizzazione in corso...";


    try {

      const response =
        await fetch(
          WORKER_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                azione:
                  "autorizzaVideo",

                token:
                  token
              }),

            cache:
              "no-store"
          }
        );


      let data;


      try {

        data =
          await response.json();

      }
      catch (e) {

        esito.textContent =
          "RISPOSTA NON JSON\nHTTP: " +
          response.status;

        return;

      }


      /*
        Famiglia non autorizzata.
      */
      if (
        !response.ok ||
        data.ok !== true ||
        data.videoAutorizzato !== true ||
        !data.videoUrl
      ) {

        esito.textContent =
          "VIDEO NON AUTORIZZATO\n\n" +
          "HTTP: " +
          response.status +
          "\nRisposta: " +
          JSON.stringify(data);

        return;

      }


      /*
        Famiglia autorizzata.

        L'URL temporaneo firmato viene usato
        SOLO come sorgente del player e
        non viene mostrato nella pagina.
      */
      esito.textContent =
        "VIDEO AUTORIZZATO\n\n" +
        "Il ticket temporaneo è valido.\n" +
        "Ora premi PLAY nel player qui sotto.";


      video.src =
        data.videoUrl;


      /*
        Mostriamo il player solo dopo
        l'autorizzazione.
      */
      areaVideo.style.display =
        "block";


      /*
        Chiediamo al browser di caricare
        i metadata. Safari/iPhone potrà
        usare le richieste Range previste
        dal Worker.
      */
      video.load();

    }

    catch (error) {

      esito.textContent =
        "ERRORE DI CONNESSIONE\n\n" +
        String(error);

    }

    finally {

      bottone.disabled =
        false;

    }

  }
);


video.addEventListener(
  "loadedmetadata",
  () => {

    esito.textContent =
      "VIDEO AUTORIZZATO\n\n" +
      "Streaming protetto raggiunto correttamente.\n" +
      "Durata rilevata: " +
      Math.round(video.duration) +
      " secondi.\n\n" +
      "Premi PLAY per verificare audio e riproduzione.";

  }
);


video.addEventListener(
  "error",
  () => {

    const codice =
      video.error
        ? video.error.code
        : "n/d";

    esito.textContent =
      "ERRORE NEL CARICAMENTO DEL VIDEO\n\n" +
      "Codice media: " +
      codice +
      "\n\n" +
      "L'autorizzazione è stata concessa, " +
      "ma il browser non è riuscito a leggere lo stream.";

  }
);

</script>

</body>
</html>
