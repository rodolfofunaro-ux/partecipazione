<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Test autorizzazione video</title>
<style>
body{font-family:Arial,sans-serif;background:#f7f7f7;margin:0;padding:24px;color:#222}
.box{max-width:620px;margin:40px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.10)}
h1{font-size:22px;margin-top:0}
input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid #bbb;border-radius:8px}
button{margin-top:14px;padding:12px 18px;font-size:16px;font-weight:700;border:0;border-radius:8px;cursor:pointer}
#esito{margin-top:18px;padding:14px;border-radius:8px;background:#f1f1f1;white-space:pre-wrap;word-break:break-word}
.nota{font-size:13px;color:#666;margin-top:12px}
</style>
</head>
<body>
<div class="box">
<h1>Test autorizzazione video</h1>
<p>Inserisci il token della famiglia di prova. Non viene memorizzato dalla pagina.</p>
<input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Token famiglia">
<button id="test">Test autorizzazione video</button>
<div id="esito">In attesa del test.</div>
<div class="nota">Pagina temporanea di collaudo. Nessun secret è contenuto nel file.</div>
</div>
<script>
const WORKER_URL="https://partecipazione-test.rodolfo-funaro.workers.dev/";

document.getElementById("test").addEventListener("click", async () => {
  const token=document.getElementById("token").value.trim();
  const esito=document.getElementById("esito");

  if(token.length<32){
    esito.textContent="TOKEN NON VALIDO: troppo corto.";
    return;
  }

  esito.textContent="Verifica in corso...";

  try{
    const response=await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        azione:"autorizzaVideo",
        token:token
      }),
      cache:"no-store"
    });

    let data;
    try { data=await response.json(); }
    catch(e) {
      esito.textContent="RISPOSTA NON JSON\nHTTP: "+response.status;
      return;
    }

    if(response.ok && data.ok===true && data.videoAutorizzato===true){
      esito.textContent=
        "VIDEO AUTORIZZATO\n\n"+
        "La famiglia è riconosciuta come VIDEO.\n"+
        (data.expiresAt ? "Scadenza autorizzazione: "+data.expiresAt+"\n" : "")+
        "\nL'indirizzo temporaneo del video non viene visualizzato.";
    } else {
      esito.textContent=
        "VIDEO NON AUTORIZZATO\n\n"+
        "HTTP: "+response.status+"\n"+
        "Risposta: "+JSON.stringify(data);
    }
  } catch(error) {
    esito.textContent="ERRORE DI CONNESSIONE\n\n"+String(error);
  }
});
</script>
</body>
</html>
