<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Partecipazione</title>

  <style>

    /* =========================
       FONT
       ========================= */

    @font-face {
      font-family: "Parisienne";
      src:
        url("fonts/Parisienne-Regular.ttf?v=1")
        format("truetype");

      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    /* Almendra Regular — VERSIONE 1.0 */
@font-face {
  font-family: "Almendra";
  src: url("fonts/Almendra-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

    /* =========================
       PAGINA
       ========================= */

    body {
      margin: 0;

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #faf9f6;

      font-family:
        Georgia,
        "Times New Roman",
        serif;
    }


    #risultato {
      width: 100%;

      padding: 20px;

      box-sizing: border-box;
    }


    /* =========================
       SCENA BUSTA
       ========================= */

    /* scena-busta — VERSIONE 2.0 — geometria verticale corretta */
.scena-busta {
  position: relative;

  width: min(88vw, 440px);
  height: 330px;

  margin: auto;

  perspective: 1000px;
}

    /* =========================
       BUSTA
       ========================= */

    .busta {
      position: absolute;

      left: 0;
      bottom: 0;

      width: 100%;
/* busta — VERSIONE 2.0 — maggiore profondità */
height: 285px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.42) 0%,
          rgba(255,255,255,0.12) 30%,
          rgba(238,231,218,0) 58%
        ),
        #eee7da;

      border-radius: 3px;

      border-top:
        1px solid
        rgba(255,255,255,0.75);

      border-left:
        1px solid
        rgba(255,255,255,0.55);

      box-shadow:
        18px 24px 34px
        rgba(70,58,42,0.20),

        7px 10px 14px
        rgba(70,58,42,0.10);

      cursor: pointer;

      overflow: visible;
    }


    /* Texture carta */

    .busta::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      z-index: 1;

      border-radius: 3px;

      background-image:
        repeating-radial-gradient(
          circle at 0 0,

          rgba(90,75,55,0.08) 0,

          rgba(90,75,55,0.08) 0.7px,

          transparent 0.9px,

          transparent 2.6px
        );

      opacity: 0.65;
    }


    /* =========================
       ALETTA
       ========================= */

    .aletta {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 135px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.30),
          rgba(248,243,233,0.95)
        );

      clip-path:
        polygon(
          0 0,
          100% 0,
          50% 100%
        );

      transform-origin:
        top center;

      transition:
        transform 1s ease;

      z-index: 6;
    }


    /* =========================
       SIGILLO CERALACCA
       ========================= */

    .sigillo {
      position: absolute;

      left: 50%;
      top: 108px;

      transform:
        translateX(-50%)
        rotate(-2deg);

      width: 54px;
      height: 52px;

      border-radius:
        58% 42% 63% 37% /
        46% 61% 39% 54%;

      background:
        radial-gradient(
          circle at 32% 28%,

          #a76458 0%,

          #87483f 38%,

          #70372f 70%,

          #5d2d28 100%
        );

      border:
        1px solid
        rgba(80,35,30,0.35);

      box-shadow:
        4px 6px 9px
        rgba(60,35,30,0.30),

        inset 2px 2px 3px
        rgba(255,255,255,0.13),

        inset -3px -3px 4px
        rgba(60,20,20,0.22);

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 7;
    }


    /* Bordo irregolare della ceralacca */

    .sigillo::before {
      content: "";

      position: absolute;

      inset: -3px;

      border-radius:
        41% 59% 48% 52% /
        57% 43% 62% 38%;

      background:
        #7a3e36;

      z-index: -1;

      box-shadow:
        2px 3px 4px
        rgba(55,25,22,0.20);
    }


    /* Impronta interna */

    .sigillo::after {
      content: "";

      position: absolute;

      width: 43px;
      height: 41px;

      border-radius:
        51% 49% 55% 45% /
        46% 54% 48% 52%;

      border:
        1px solid
        rgba(255,225,205,0.20);

      box-shadow:
        inset 1px 1px 2px
        rgba(255,255,255,0.10),

        inset -1px -1px 2px
        rgba(65,20,18,0.22);

      z-index: 1;
    }


    /* Iniziale nel sigillo */

    .sigillo span {
      position: relative;

      z-index: 2;

      font-family:
        "Parisienne",
        "Times New Roman",
        serif;

      font-size: 28px;
      font-weight: 400;

      color:
        rgba(232,190,175,0.88);

      text-shadow:
        1px 1px 1px
        rgba(255,255,255,0.12),

        -1px -1px 1px
        rgba(55,20,18,0.40);

      transform:
        translateY(-1px);
    }


    /* =========================
       TESTO BUSTA
       ========================= */

    .fronte-busta {
      position: absolute;

      inset: 0;

      z-index: 6;

      display: flex;

      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      padding-top: 82px;

      box-sizing: border-box;
    }


    .per {
      font-size: 13px;

      letter-spacing: 0.18em;

      text-transform: uppercase;

      margin-bottom: 8px;

      color: #8a7962;
    }


    .nome-invitato {
      font-family:
        "Parisienne",
        "Times New Roman",
        serif;

      font-size:
        clamp(
          29px,
          7vw,
          40px
        );

      font-weight: 400;

      line-height: 1.15;

      color: #493f33;

      padding:
        0 24px;
    }


    /* =========================
       CARTONCINO COMPLETO
       VERSIONE 3.0
       Un solo SVG 1748x1240: sfondo + dati protetti.
       Tutto scala come un unico oggetto.
       ========================= */

    .cartoncino {
      position: absolute;
      left: 11%;
      bottom: 0;
      width: 78%;
      aspect-ratio: 1748 / 1240;
      height: auto;
      background: #f8f5ee;
      border-radius: 2px;
      box-shadow: 8px 10px 18px rgba(70,58,42,0.18);
      z-index: 4;
      transform: translate3d(0,0,0);
      transition: transform 2.2s cubic-bezier(0.22,0.61,0.36,1);
      will-change: transform;
      pointer-events: none;
      overflow: hidden;
    }

    .cartoncino-svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Tutti i dati sono dentro il viewBox fisso 1748x1240. */
    .dati-svg {
      box-sizing: border-box;
      color: #111;
      text-align: center;
      font-family: "Almendra", serif;
      line-height: 1.12;
    }

    /* Shabbat — VERSIONE 1.4 BLOCCATA */
    .dati-shabbat-svg {
      width: 690px;
      font-size: 43px;
    }

    .dati-shabbat-svg .riga2 {
      margin-top: 12px;
    }

    /* Party — VERSIONE 1.2 — allineato a Shabbat e spostato a destra */
    .dati-party-svg {
      width: 810px;
      font-size: 43px;
      line-height: 1.12;
    }

    .dati-party-svg .intro-riga2 {
      margin-top: 2px;
    }

    .dati-party-svg .location {
      margin-top: 10px;
      font-family: "Parisienne", cursive;
      font-size: 68px;
      font-weight: 700;
      line-height: 1;
      color: #d99a32;
      -webkit-text-stroke: 0.5px rgba(0, 0, 0, 0.75);
      paint-order: stroke fill;
    }

    .dati-party-svg .indirizzo {
      margin-top: 10px;
      font-family: "Almendra", serif;
      font-size: 37px;
      line-height: 1.1;
      white-space: nowrap;
    }

    /* Contributo / pagamento — VERSIONE 1.1 — abbassato nella zona finale */
    .dati-pagamento-svg {
      width: 1500px;
      font-family: "Almendra", serif;
      font-size: 34px;
      line-height: 1.12;
      white-space: nowrap;
    }

    .dati-pagamento-svg .paypal {
      margin-top: 12px;
    }

    /* Anteprima statica: usa lo stesso identico SVG della busta. */
    .anteprima-cartoncino {
      width: min(94vw, calc(88vh * 1748 / 1240));
      aspect-ratio: 1748 / 1240;
      margin: 0 auto;
      overflow: hidden;
      background: #f8f5ee;
      border-radius: 2px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.10);
    }

    .anteprima-cartoncino .cartoncino-svg {
      width: 100%;
      height: 100%;
    }

/* tasca-busta — VERSIONE 2.3 — crop esattamente sul bordo */
.tasca-busta {
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,0.42) 0%,
      rgba(255,255,255,0.12) 30%,
      rgba(238,231,218,0) 58%
    ),
    #eee7da;

  border-radius: 3px;

  z-index: 5;

  pointer-events: none;
}
.tasca-busta::after {
  content: "";
  position: absolute;
  inset: 0;

  background-image:
    repeating-radial-gradient(
      circle at 0 0,
      rgba(90,75,55,0.08) 0,
      rgba(90,75,55,0.08) 0.7px,
      transparent 0.9px,
      transparent 2.6px
    );

  opacity: 0.65;

  pointer-events: none;
}

/* estrazione cartoncino — VERSIONE 2.0 — uscita completa */
.busta.aperta .cartoncino {
  transform:
    translate3d(0, -290px, 0);

  transition-delay: 1.05s;
}

    .tocca {
      position: absolute;

      bottom: -38px;

      width: 100%;

      text-align: center;

      font-size: 13px;

      letter-spacing: 0.08em;

      color: #8a8175;
    }

.cartoncino-volante {
  position: fixed;

  margin: 0;
  padding: 0;

  z-index: 1000;

  transform: none;

  pointer-events: none;

  transition:
    left 1.2s cubic-bezier(0.22, 0.61, 0.36, 1),
    top 1.2s cubic-bezier(0.22, 0.61, 0.36, 1),
    width 1.2s cubic-bezier(0.22, 0.61, 0.36, 1),
    height 1.2s cubic-bezier(0.22, 0.61, 0.36, 1);

  will-change:
    left,
    top,
    width,
    height;
}
    /* =========================
       FUTURA APERTURA
       ========================= */

/* aletta aperta — VERSIONE 1.2 — scende dietro dopo la rotazione */
.busta.aperta .aletta {
  background:
    linear-gradient(
      135deg,
      #e2d8c8 0%,
      #d8cbb8 55%,
      #cfc0aa 100%
    );

  animation:
    apriAletta 1s ease forwards;
}
    /* apriAletta — VERSIONE 1.0 */
@keyframes apriAletta {

  0% {
    transform: rotateX(0deg);
    z-index: 6;
  }

  99% {
    transform: rotateX(180deg);
    z-index: 6;
  }

  100% {
    transform: rotateX(180deg);
    z-index: 3;
  }
}
    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 480px) {

      #risultato {
        padding:
          14px;
      }

      .scena-busta {
        width:
          min(92vw, 420px);
      }

      .tocca {
        bottom:
          -34px;
      }

    }

  </style>
</head>


<body>

  <div id="risultato"></div>


  <script>

    /* =========================
       TOKEN
       ========================= */

    var TOKEN = "";


    window.onload = function() {

      var parametri =
        new URLSearchParams(
          window.location.hash.substring(1)
        );


      var tokenDaUrl =
        String(
          parametri.get("t") || ""
        ).trim();


      /*
        Se il token arriva dal link:
        1. lo memorizziamo
        2. lo togliamo dall'indirizzo
      */

      if (tokenDaUrl) {

        TOKEN =
          tokenDaUrl;


        try {

          sessionStorage.setItem(
            "tokenPartecipazione",
            TOKEN
          );


          history.replaceState(
            null,
            "",
            window.location.pathname +
            window.location.search
          );

        }

        catch (errore) {

          /*
            Se sessionStorage non funziona,
            il token resta nel fragment URL.
          */

        }

      }


      /*
        Se abbiamo fatto refresh,
        recuperiamo il token dalla sessione.
      */

      else {

        try {

          TOKEN =
            String(
              sessionStorage.getItem(
                "tokenPartecipazione"
              ) || ""
            ).trim();

        }

        catch (errore) {

          TOKEN = "";

        }

      }


      if (TOKEN) {

        verificaToken();

      }

    };




  /* =========================
     VERIFICA TOKEN
     ========================= */

  // verificaToken() — VERSIONE 3.0 — dati evento solo dopo token valido
  function verificaToken() {
    var risultato = document.getElementById("risultato");
    risultato.textContent = "Verifica in corso...";

    fetch(
      "https://partecipazione-test.rodolfo-funaro.workers.dev/",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: TOKEN }),
        cache: "no-store"
      }
    )
    .then(function(response) {
      if (!response.ok) throw new Error("Errore HTTP");
      return response.json();
    })
    .then(function(data) {
      if (data.ok !== true) {
        risultato.innerHTML = "<strong>TOKEN NON VALIDO</strong>";
        return;
      }

      var evento = data.evento || {};

      /*
        Anteprima solo se nella query c'è preview=1.
        Il link normale continua a mostrare la busta.
      */
      var query = new URLSearchParams(window.location.search);

      if (query.get("preview") === "1") {
        mostraAnteprimaCartoncino(evento);
      } else {
        mostraBusta(data.intestazione || "", evento);
      }
    })
    .catch(function() {
      risultato.innerHTML = "<strong>ERRORE DI COLLEGAMENTO</strong>";
    });
  }

  /* =========================
     CARTONCINO COMPLETO PROTETTO
     ========================= */

  // creaCartoncinoCompleto() — VERSIONE 3.0 — SVG unico 1748x1240
  function creaCartoncinoCompleto(evento) {
    evento = evento || {};

    var NS = "http://www.w3.org/2000/svg";
    var XHTML = "http://www.w3.org/1999/xhtml";

    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "cartoncino-svg");
    svg.setAttribute("viewBox", "0 0 1748 1240");
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    svg.setAttribute("aria-label", "Partecipazione");

    var sfondo = document.createElementNS(NS, "image");
    sfondo.setAttribute("href", "cartoncino_base_web_q84.jpg");
    sfondo.setAttribute("x", "0");
    sfondo.setAttribute("y", "0");
    sfondo.setAttribute("width", "1748");
    sfondo.setAttribute("height", "1240");
    sfondo.setAttribute("preserveAspectRatio", "none");
    svg.appendChild(sfondo);

    function aggiungiBlocco(x, y, w, h, className, costruttore) {
      var fo = document.createElementNS(NS, "foreignObject");
      fo.setAttribute("x", String(x));
      fo.setAttribute("y", String(y));
      fo.setAttribute("width", String(w));
      fo.setAttribute("height", String(h));

      var div = document.createElementNS(XHTML, "div");
      div.setAttribute("class", "dati-svg " + className);
      costruttore(div);

      fo.appendChild(div);
      svg.appendChild(fo);
    }

    /* Shabbat: coordinate già approvate. */
    aggiungiBlocco(28, 635, 690, 150, "dati-shabbat-svg", function(div) {
      var r1 = document.createElementNS(XHTML, "div");
      r1.textContent = evento.shabbatData || "";

      var r2 = document.createElementNS(XHTML, "div");
      r2.setAttribute("class", "riga2");
      r2.textContent =
        (evento.shabbatLuogo || "") +
        ((evento.shabbatLuogo || evento.shabbatOra) ? " - ore " : "") +
        (evento.shabbatOra || "");

      div.appendChild(r1);
      div.appendChild(r2);
    });

    /* Party — VERSIONE 1.2
       I valori arrivano esclusivamente dal backend dopo token valido.
       Il testo CONFIG viene diviso graficamente prima di "domenica". */
    aggiungiBlocco(875, 635, 810, 300, "dati-party-svg", function(div) {
      var testoParty = String(evento.partyTesto || "").trim();
      var riga1Testo = testoParty;
      var riga2Testo = "";

      var puntoDomenica = testoParty.search(/\bdomenica\b/i);

      if (puntoDomenica > 0) {
        riga1Testo = testoParty.substring(0, puntoDomenica).trim();
        riga2Testo = testoParty.substring(puntoDomenica).trim();
      }

      var introRiga1 = document.createElementNS(XHTML, "div");
      introRiga1.textContent = riga1Testo;
      div.appendChild(introRiga1);

      if (riga2Testo) {
        var introRiga2 = document.createElementNS(XHTML, "div");
        introRiga2.setAttribute("class", "intro-riga2");
        introRiga2.textContent = riga2Testo;
        div.appendChild(introRiga2);
      }

      var location = document.createElementNS(XHTML, "div");
      location.setAttribute("class", "location");
      location.textContent = evento.partyLocation || "";

      var indirizzo = document.createElementNS(XHTML, "div");
      indirizzo.setAttribute("class", "indirizzo");
      indirizzo.textContent =
        (evento.partyIndirizzo || "") +
        ((evento.partyIndirizzo || evento.partyOra) ? " - ore " : "") +
        (evento.partyOra || "");

      div.appendChild(location);
      div.appendChild(indirizzo);
    });

    /* IBAN + PayPal: restano assenti dal repository, vengono creati qui in memoria. */
    aggiungiBlocco(124, 1090, 1500, 125, "dati-pagamento-svg", function(div) {
      var iban = document.createElementNS(XHTML, "div");
      iban.textContent = evento.ibanTesto || "";

      var paypal = document.createElementNS(XHTML, "div");
      paypal.setAttribute("class", "paypal");
      paypal.textContent = evento.paypalTesto || "";

      div.appendChild(iban);
      div.appendChild(paypal);
    });

    return svg;
  }

  // mostraAnteprimaCartoncino() — VERSIONE 2.0 — stesso oggetto della busta
  function mostraAnteprimaCartoncino(evento) {
    var risultato = document.getElementById("risultato");
    risultato.innerHTML = "";

    var contenitore = document.createElement("div");
    contenitore.className = "anteprima-cartoncino";
    contenitore.appendChild(creaCartoncinoCompleto(evento));

    risultato.appendChild(contenitore);
  }

  /* =========================
     CREA BUSTA
     ========================= */

  // mostraBusta() — VERSIONE 3.0 — inserisce il cartoncino completo già composto
  function mostraBusta(intestazione, evento) {
    var risultato = document.getElementById("risultato");

    risultato.innerHTML =
      '<div class="scena-busta">' +
        '<div id="bustaTest" class="busta" onclick="apriBusta()">' +
          '<div class="aletta"></div>' +
          '<div id="cartoncinoHost" class="cartoncino"></div>' +
          '<div class="tasca-busta"></div>' +
          '<div class="sigillo"><span>A</span></div>' +
          '<div class="fronte-busta">' +
            '<div class="per">Per</div>' +
            '<div class="nome-invitato">' + escapeHtml(intestazione) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="tocca">TOCCA PER APRIRE</div>' +
      '</div>';

    var host = document.getElementById("cartoncinoHost");
    if (host) {
      host.appendChild(creaCartoncinoCompleto(evento));
    }
  }

    /* =========================
       APERTURA - TEMPORANEA
       ========================= */

// apriBusta() — VERSIONE 1.6 — sincronizzata con apertura completa dell'aletta
function apriBusta() {

  var busta =
    document.getElementById("bustaTest");

  if (!busta) {
    return;
  }

  busta.classList.add("aperta");

  /*
    Aspettiamo la fine dell'estrazione.
  */
  setTimeout(function() {

    var originale =
      busta.querySelector(".cartoncino");

    if (!originale) {
      return;
    }

    var rect =
      originale.getBoundingClientRect();

    /*
      Creiamo una copia identica
      esattamente sopra l'originale.
    */
    var volante =
      originale.cloneNode(true);

    volante.classList.add(
      "cartoncino-volante"
    );

    volante.style.left =
      rect.left + "px";

    volante.style.top =
      rect.top + "px";

    volante.style.width =
      rect.width + "px";

    volante.style.height =
      rect.height + "px";

    volante.style.transform =
      "none";

    document.body.appendChild(
      volante
    );

    /*
      La copia prende il posto visivo
      dell'originale senza salto.
    */
    originale.style.visibility =
      "hidden";

    /*
      Spazio finale disponibile.
    */
    var maxWidth =
      window.innerWidth * 0.94;

    var maxHeight =
      window.innerHeight * 0.88;

    var rapporto =
      rect.width / rect.height;

    var finalWidth =
      maxWidth;

    var finalHeight =
      finalWidth / rapporto;

    if (finalHeight > maxHeight) {

      finalHeight =
        maxHeight;

      finalWidth =
        finalHeight * rapporto;
    }

    /*
      Centratura nella viewport.
    */
    var finalLeft =
      (window.innerWidth -
       finalWidth) / 2;

    var finalTop =
      (window.innerHeight -
       finalHeight) / 2;

    /*
      Due frame separati evitano
      il salto immediato.
    */
    requestAnimationFrame(function() {

      requestAnimationFrame(function() {

        volante.style.left =
          finalLeft + "px";

        volante.style.top =
          finalTop + "px";

        volante.style.width =
          finalWidth + "px";

        volante.style.height =
          finalHeight + "px";

      });

    });

  }, 3500);
}
    /* =========================
       SICUREZZA TESTO
       ========================= */

    function escapeHtml(testo) {

      return String(
        testo || ""
      )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

    }


  </script>
