<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Partecipazione</title>

  <style>

    /* =========================
       FONT
       ========================= */

    @font-face {
      font-family: "Parisienne";
      src:
        url("fonts/Parisienne-Regular.ttf?v=1")
        format("truetype");

      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    /* Almendra Regular — VERSIONE 1.0 */
@font-face {
  font-family: "Almendra";
  src: url("fonts/Almendra-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

    /* Amerigo Md BT Corsivo Medio — VERSIONE 1.1 — font unico dati cartoncino */
@font-face {
  font-family: "AmerigoMdBT";
  src: url("fonts/Amerigo%20Md%20BT%20Corsivo%20medio.ttf?v=1") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

    /* =========================
       PAGINA
       ========================= */

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        repeating-radial-gradient(
          circle at 0 0,
          rgba(95, 88, 78, 0.025) 0,
          rgba(95, 88, 78, 0.025) 0.7px,
          transparent 0.9px,
          transparent 3px
        ),
        radial-gradient(
          circle at 50% 38%,
          #ffffff 0%,
          #faf9f5 58%,
          #efede7 100%
        );

      font-family:
        Georgia,
        "Times New Roman",
        serif;
    }


    #risultato {
      width: 100%;

      padding: 20px;

      box-sizing: border-box;
    }


    /* =========================
       SCENA BUSTA
       ========================= */

    /* scena-busta — VERSIONE 2.0 — geometria verticale corretta */
.scena-busta {
  position: relative;

  width: min(88vw, 440px);
  height: 330px;

  margin: auto;

  perspective: 1000px;
}

    /* =========================
       BUSTA
       ========================= */

    .busta {
      position: absolute;

      left: 0;
      bottom: 0;

      width: 100%;
/* busta — VERSIONE 2.0 — maggiore profondità */
height: 285px;

      background:
        linear-gradient(rgba(255,255,255,0.10), rgba(255,255,255,0.10)),
        url("sfondo_pulito_1748x1240.png") center center / cover no-repeat,
        #f8f7f3;

      border-radius: 3px;

      border: 1px solid rgba(110,100,90,0.10);

      box-shadow:
        0 4px 8px rgba(55,48,40,0.08),
        14px 22px 30px rgba(55,48,40,0.20),
        24px 34px 46px rgba(55,48,40,0.13),
        0 1px 0 rgba(255,255,255,0.85) inset;

      cursor: pointer;

      overflow: visible;
    }


    /* =========================
       ROTAZIONE 3D BUSTA
       VERSIONE 1.2
       Retro iniziale con intestazione integrata.
       A fine rotazione il wrapper 3D viene appiattito
       prima di avviare l'animazione originale.
       ========================= */

    .busta-flip {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 285px;

      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;

      transform: rotateY(0deg);

      transition:
        transform 1.85s cubic-bezier(0.20, 0.70, 0.20, 1);

      will-change: transform;

      cursor: pointer;

      user-select: none;
      -webkit-user-select: none;

      caret-color: transparent;
      outline: none;
    }

    .busta-flip.in-rotazione {
      transform: rotateY(180deg);
    }

    /*
      Dopo il flip la struttura viene resa nuovamente
      "piatta", senza alcun transform sull'antenato.
      È fondamentale per conservare identica
      l'animazione originale del cartoncino.
    */
    .busta-flip.rotazione-completata {
      transform: none !important;
      transition: none !important;
      transform-style: flat;
      -webkit-transform-style: flat;
      cursor: default;
    }

    .faccia-busta {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      border-radius: 3px;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;

      user-select: none;
      -webkit-user-select: none;

      caret-color: transparent;
    }

    /* RETRO: prima faccia visibile */
    .retro-busta {
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: center;

      box-sizing: border-box;
      padding: 28px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.18),
          rgba(255,255,255,0.02)
        ),
        url("sfondo_pulito_1748x1240.png") center center / cover no-repeat,
        #f8f7f3;

      border: 1px solid rgba(110,100,90,0.10);

      box-shadow:
        0 4px 8px rgba(55,48,40,0.08),
        14px 22px 30px rgba(55,48,40,0.20),
        24px 34px 46px rgba(55,48,40,0.13),
        0 1px 0 rgba(255,255,255,0.85) inset;

      overflow: hidden;
    }

    .retro-busta::after {
      content: "";
      position: absolute;
      inset: 0;

      border-radius: 3px;

      background-image:
        repeating-radial-gradient(
          circle at 0 0,
          rgba(90,75,55,0.08) 0,
          rgba(90,75,55,0.08) 0.7px,
          transparent 0.9px,
          transparent 2.6px
        );

      opacity: 0.82;
      pointer-events: none;
    }

    .retro-busta .nome-invitato {
      position: relative;
      z-index: 2;

      width: 100%;
      padding: 0 18px;

      text-align: center;

      transform: translateZ(1px);

      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      caret-color: transparent;
    }

    /* FRONTE: contiene la busta originale completa */
    .fronte-flip {
      z-index: 1;

      transform: rotateY(180deg);

      overflow: visible;

      background:
        url("sfondo_pulito_1748x1240.png") center center / cover no-repeat,
        #f8f7f3;
    }

    /*
      Stato finale istantaneo:
      retro eliminato dalla scena e fronte riportato
      a orientamento normale prima dell'apertura.
    */
    .busta-flip.rotazione-completata .retro-busta {
      display: none;
    }

    .busta-flip.rotazione-completata .fronte-flip {
      transform: none !important;
      backface-visibility: visible;
      -webkit-backface-visibility: visible;
    }


    /* Texture carta */

    .busta::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      z-index: 1;

      border-radius: 3px;

      background-image:
        repeating-radial-gradient(
          circle at 0 0,

          rgba(90,75,55,0.08) 0,

          rgba(90,75,55,0.08) 0.7px,

          transparent 0.9px,

          transparent 2.6px
        );

      opacity: 0.82;
    }


    /* =========================
       ALETTA
       ========================= */

    .aletta {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 135px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.30),
          rgba(255,255,255,0.08)
        ),
        url("sfondo_pulito_1748x1240.png") center 22% / cover no-repeat,
        #f8f7f3;

      clip-path:
        polygon(
          0 0,
          100% 0,
          50% 100%
        );

      transform-origin:
        top center;

      transition:
        transform 1s ease;

      z-index: 6;
    }



    /* Carta coordinata busta — VERSIONE 1.0 */
    .aletta {
      filter: saturate(0.92) brightness(1.02);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.70) inset,
        0 2px 3px rgba(70,58,65,0.07);
    }

    .tasca-busta {
      filter: saturate(0.96) brightness(0.99);
      box-shadow:
        0 -1px 0 rgba(255,255,255,0.42) inset;
    }


    /* =========================
       SIGILLO CERALACCA
       ========================= */

    .sigillo {
      position: absolute;

      left: 50%;
      top: 108px;

      transform:
        translateX(-50%)
        rotate(-2deg);

      width: 54px;
      height: 52px;

      border-radius:
        58% 42% 63% 37% /
        46% 61% 39% 54%;

      background:
        radial-gradient(
          circle at 32% 28%,

          #a76458 0%,

          #87483f 38%,

          #70372f 70%,

          #5d2d28 100%
        );

      border:
        1px solid
        rgba(80,35,30,0.35);

      box-shadow:
        4px 6px 9px
        rgba(60,35,30,0.30),

        inset 2px 2px 3px
        rgba(255,255,255,0.13),

        inset -3px -3px 4px
        rgba(60,20,20,0.22);

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 7;
    }


    /* Bordo irregolare della ceralacca */

    .sigillo::before {
      content: "";

      position: absolute;

      inset: -3px;

      border-radius:
        41% 59% 48% 52% /
        57% 43% 62% 38%;

      background:
        #7a3e36;

      z-index: -1;

      box-shadow:
        2px 3px 4px
        rgba(55,25,22,0.20);
    }


    /* Impronta interna */

    .sigillo::after {
      content: "";

      position: absolute;

      width: 43px;
      height: 41px;

      border-radius:
        51% 49% 55% 45% /
        46% 54% 48% 52%;

      border:
        1px solid
        rgba(255,225,205,0.20);

      box-shadow:
        inset 1px 1px 2px
        rgba(255,255,255,0.10),

        inset -1px -1px 2px
        rgba(65,20,18,0.22);

      z-index: 1;
    }


    /* Iniziale nel sigillo */

    .sigillo span {
      position: relative;

      z-index: 2;

      font-family:
        "Parisienne",
        "Times New Roman",
        serif;

      font-size: 28px;
      font-weight: 400;

      color:
        rgba(232,190,175,0.88);

      text-shadow:
        1px 1px 1px
        rgba(255,255,255,0.12),

        -1px -1px 1px
        rgba(55,20,18,0.40);

      transform:
        translateY(-1px);
    }


    /* =========================
       TESTO BUSTA
       ========================= */

    .fronte-busta {
      position: absolute;

      inset: 0;

      z-index: 6;

      display: flex;

      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      padding-top: 82px;

      box-sizing: border-box;
    }


    .per {
      font-size: 13px;

      letter-spacing: 0.18em;

      text-transform: uppercase;

      margin-bottom: 8px;

      color: #8a7962;
    }


/* Intestazione invitato — VERSIONE 2.0 — Amerigo Md BT */
.nome-invitato {
  font-family:
    "AmerigoMdBT",
    Georgia,
    serif;

  font-size:
    clamp(
      29px,
      7vw,
      40px
    );

  font-style: normal;
  font-weight: 400;

  line-height: 1.15;

  color: #493f33;

  padding:
    0 24px;
}


    /* =========================
       CARTONCINO COMPLETO
       VERSIONE 3.0
       Un solo SVG 1748x1240: sfondo + dati protetti.
       Tutto scala come un unico oggetto.
       ========================= */

    .cartoncino {
      position: absolute;
      left: 11%;
      bottom: 0;
      width: 78%;
      aspect-ratio: 1748 / 1240;
      height: auto;
      background: #f8f5ee;
      border-radius: 2px;
      box-shadow: 8px 10px 18px rgba(70,58,42,0.18);
      z-index: 4;
      transform: translate3d(0,0,0);
      transition: transform 2.2s cubic-bezier(0.22,0.61,0.36,1);
      will-change: transform;
      pointer-events: none;
      overflow: hidden;
    }

    .cartoncino-svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Tutti i dati sono dentro il viewBox fisso 1748x1240. */
    /* Dati cartoncino — VERSIONE 4.0 — Amerigo Md BT unico per tutti i testi dinamici */
    .dati-svg {
      box-sizing: border-box;
      color: #111;
      text-align: center;
      font-family: "AmerigoMdBT", Georgia, serif;
      font-style: normal;
      font-weight: 400;
      line-height: 1.12;
    }

    /* Shabbat — VERSIONE 1.5 — nuova posizione gestita nello SVG */
    .dati-shabbat-svg {
      width: 690px;
      font-size: 43px;
      font-weight: 700;
    }

    .dati-shabbat-svg .riga2 {
      margin-top: 12px;
    }

    /* Party — VERSIONE 1.3 — Amerigo unico */
    .dati-party-svg {
      width: 810px;
      font-size: 43px;
      line-height: 1.12;
      font-weight: 700;
    }

    .dati-party-svg .intro-riga2 {
      margin-top: 2px;
    }

   /* Villa Cinardi — VERSIONE 1.7 — bordo e rilievo rinforzati */
.dati-party-svg .location {
  margin-top: 10px;

  font-family: "AmerigoMdBT", Georgia, serif;
  font-style: normal;
  font-size: 68px;
  font-weight: 700;
  line-height: 1;

  color: #e5ad43;

  /* Più vicino alla presenza grafica del titolo Party */
  -webkit-text-stroke: 1.35px rgba(72, 47, 13, 0.96);
  paint-order: stroke fill;

  text-shadow:
    -0.9px -0.9px 0 rgba(255, 247, 196, 0.98),
     1.5px  1.0px 0 #a46813,
     2.8px  1.9px 1px rgba(86, 52, 8, 0.72),
     4.0px  2.8px 2px rgba(52, 34, 7, 0.42);
}

    .dati-party-svg .indirizzo {
      margin-top: 10px;
      font-family: "AmerigoMdBT", Georgia, serif;
      font-style: normal;
      font-size: 37px;
      line-height: 1.1;
      white-space: nowrap;
    }

    /* Contributo / pagamento — VERSIONE 1.2 — Amerigo unico */
    .dati-pagamento-svg {
      width: 1500px;
      font-family: "AmerigoMdBT", Georgia, serif;
      font-style: normal;
      font-size: 34px;
      line-height: 1.12;
      white-space: nowrap;
    }

    .dati-pagamento-svg .paypal {
      margin-top: 12px;
    }

    /* Anteprima statica: usa lo stesso identico SVG della busta. */
    .anteprima-cartoncino {
      width: min(94vw, calc(88vh * 1748 / 1240));
      aspect-ratio: 1748 / 1240;
      margin: 0 auto;
      overflow: hidden;
      background: #f8f5ee;
      border-radius: 2px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.10);
    }

    .anteprima-cartoncino .cartoncino-svg {
      width: 100%;
      height: 100%;
    }

/* tasca-busta — VERSIONE 2.3 — crop esattamente sul bordo */
.tasca-busta {
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,0.08),
      rgba(238,232,245,0.08)
    ),
    url("sfondo_pulito_1748x1240.png") center 66% / cover no-repeat,
    #f8f7f3;

  border-radius: 3px;

  z-index: 5;

  pointer-events: none;
}
.tasca-busta::after {
  content: "";
  position: absolute;
  inset: 0;

  background-image:
    repeating-radial-gradient(
      circle at 0 0,
      rgba(90,75,55,0.08) 0,
      rgba(90,75,55,0.08) 0.7px,
      transparent 0.9px,
      transparent 2.6px
    );

  opacity: 0.82;

  pointer-events: none;
}

/* estrazione cartoncino — VERSIONE 2.0 — uscita completa */
.busta.aperta .cartoncino {
  transform:
    translate3d(0, -290px, 0);

  transition-delay: 1.05s;
}

    .tocca {
      position: absolute;

      bottom: -38px;

      width: 100%;

      text-align: center;

      font-size: 13px;

      letter-spacing: 0.08em;

      color: #8a8175;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      pointer-events: auto;
    }

.cartoncino-volante {
  position: fixed;

  margin: 0;
  padding: 0;

  z-index: 1000;

  transform: none;

  pointer-events: none;

  transition:
    left 1.2s cubic-bezier(0.22, 0.61, 0.36, 1),
    top 1.2s cubic-bezier(0.22, 0.61, 0.36, 1),
    width 1.2s cubic-bezier(0.22, 0.61, 0.36, 1),
    height 1.2s cubic-bezier(0.22, 0.61, 0.36, 1);

  will-change:
    left,
    top,
    width,
    height;
}
    /* =========================
       FUTURA APERTURA
       ========================= */

/* aletta aperta — VERSIONE 1.2 — scende dietro dopo la rotazione */
.busta.aperta .aletta {
  background:
    linear-gradient(
      rgba(215,208,220,0.24),
      rgba(190,182,198,0.28)
    ),
    url("sfondo_pulito_1748x1240.png") center 22% / cover no-repeat,
    #ece9ed;

  animation:
    apriAletta 1s ease forwards;
}
    /* apriAletta — VERSIONE 1.0 */
@keyframes apriAletta {

  0% {
    transform: rotateX(0deg);
    z-index: 6;
  }

  99% {
    transform: rotateX(180deg);
    z-index: 6;
  }

  100% {
    transform: rotateX(180deg);
    z-index: 3;
  }
}
    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 480px) {

      #risultato {
        padding:
          14px;
      }

      .scena-busta {
        width:
          min(92vw, 420px);
      }

      .tocca {
        bottom:
          -34px;
      }

    }

 /* Pulsante musica — VERSIONE 1.2 — icona + testo */
#btnMusica {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 5000;

  display: flex;
  align-items: center;
  gap: 7px;

  padding: 8px 12px;

  border: 1px solid rgba(0,0,0,0.15);
  border-radius: 20px;

  background: rgba(255,255,255,0.88);

  color: #555;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 11px;
  letter-spacing: 0.7px;

  cursor: pointer;
  box-shadow: 0 3px 12px rgba(0,0,0,0.15);
}

#iconaMusica {
  font-size: 17px;
  line-height: 1;
}

    /* Loader clessidra — VERSIONE 3.1 — palette coordinata alla busta */
.loader-clessidra {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;

  /*
    Trasparente: lascia vedere ESATTAMENTE lo stesso sfondo del body,
    evitando il cambio di colore quando compare la busta.
  */
  background: transparent;
}

.clessidra-animata {
  width: 76px;
  height: 94px;
  animation: giraClessidra 1.55s cubic-bezier(.45,.05,.55,.95) infinite;
  filter: drop-shadow(0 5px 8px rgba(92,88,126,.16));
  transform-origin: 50% 50%;
}
.clessidra-animata svg { display:block; width:100%; height:100%; }
.loader-testo {
  margin-top:14px;
  font:700 14px/1.2 Georgia,serif;
  color:#706b86;
  letter-spacing:.04em;
}

@keyframes giraClessidra {
  0%, 38% { transform: rotate(0deg); }
  62%, 100% { transform: rotate(180deg); }
}

    /* =========================
       RSVP — VERSIONE 1.3
       Hotspot invisibile + modale ottimizzata smartphone
       ========================= */

    .anteprima-cartoncino {
      position: relative;
    }

    /* RSVP dinamico — VERSIONE 3.2 — posizione fissa + riflesso metallico */
    .rsvp-svg-group {
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }

    .rsvp-svg-group:focus {
      outline: none;
    }

    .rsvp-svg-shadow {
      fill: rgba(132, 82, 20, 0.42);
      animation: pulsaOmbraRSVP 1.35s ease-in-out infinite;
    }

    .rsvp-svg-base {
      fill: url(#rsvpMetalGradient);
      stroke: rgba(126, 82, 21, 0.92);
      stroke-width: 4;
      animation: pulsaBaseRSVP 1.35s ease-in-out infinite;
    }

    .rsvp-svg-inner {
      fill: none;
      stroke: rgba(255,255,255,.46);
      stroke-width: 2.4;
      pointer-events: none;
    }

    .rsvp-svg-text {
      fill: #4b3214;
      font-family: "AmerigoMdBT", Georgia, serif;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: 2px;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    /*
      Il riflesso percorre il bottone senza trasformare il gruppo RSVP.
      Quindi il pulsante rimane perfettamente fermo sul cartoncino.
    */
    .rsvp-svg-shine {
      fill: url(#rsvpShineGradient);
      opacity: 0;
      pointer-events: none;
    }

    @keyframes pulsaBaseRSVP {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.18); }
    }

    @keyframes pulsaOmbraRSVP {
      0%, 100% { opacity: .78; }
      50% { opacity: .44; }
    }

    .cartoncino-volante.rsvp-attivo { pointer-events: auto; }

    .rsvp-overlay {
      position: fixed;
      inset: 0;
      z-index: 12000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 18px;
      box-sizing: border-box;

      background: rgba(64, 76, 83, 0.40);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .rsvp-modale {
      position: relative;

      width: min(92vw, 470px);
      max-height: 90vh;
      overflow-y: auto;

      box-sizing: border-box;
      padding: 34px 30px 30px;

      border-radius: 18px;
      border: 1px solid rgba(124, 184, 196, 0.30);

      background:
        repeating-radial-gradient(
          circle at 0 0,

  <script>

    /* =========================
       TOKEN
       ========================= */

    var TOKEN = "";

    // RSVP — VERSIONE 1.0 — stato ricevuto dal backend
    var STATO_RSVP = "";
    var PARTECIPANTI_RSVP = 0;
    var BAMBINI_RSVP = 0;
    var VIDEO_URL_TEMPORANEO = "";
    var VOLUME_MUSICA_NORMALE = 0.55;
    var VOLUME_MUSICA_VIDEO = 0.14;
    var TIMER_VOLUME_MUSICA = null;



    window.onload = function() {

      var parametri =
        new URLSearchParams(
          window.location.hash.substring(1)
        );


      var tokenDaUrl =
        String(
          parametri.get("t") || ""
        ).trim();


      /*
        Se il token arriva dal link:
        1. lo memorizziamo
        2. lo togliamo dall'indirizzo
      */

      if (tokenDaUrl) {

        TOKEN =
          tokenDaUrl;


        try {

          sessionStorage.setItem(
            "tokenPartecipazione",
            TOKEN
          );


          /*
            v6.9.1: manteniamo il token nel fragment.
            Il fragment non viene inviato al server, ma rende il refresh
            molto più robusto nelle WebView mobili (es. WhatsApp/iOS).
          */
          history.replaceState(
            { tokenPartecipazione: TOKEN },
            "",
            window.location.pathname +
            window.location.search +
            "#t=" + encodeURIComponent(TOKEN)
          );

        }

        catch (errore) {

          /*
            Se sessionStorage non funziona,
            il token resta nel fragment URL.
          */

        }

      }


      /*
        Se abbiamo fatto refresh,
        recuperiamo il token dalla sessione.
      */

      else {

        try {

          TOKEN = String(
            (history.state && history.state.tokenPartecipazione) ||
            sessionStorage.getItem("tokenPartecipazione") ||
            ""
          ).trim();

        }

        catch (errore) {

          TOKEN = "";

        }

      }


      if (TOKEN) {

        verificaToken();

      }

    };




  /* =========================
     RETE ROBUSTA — VERSIONE 1.0
     Timeout + retry per WebView/iPhone/WhatsApp
     ========================= */
  function fetchJsonRobusto(url, opzioni, tentativi, timeoutMs) {
    tentativi = tentativi || 3;
    timeoutMs = timeoutMs || 6500;

    function prova(numero) {
      var controller = (typeof AbortController !== "undefined") ? new AbortController() : null;
      var timer = null;
      var opts = Object.assign({}, opzioni || {});
      if (controller) opts.signal = controller.signal;

      if (controller) {
        timer = setTimeout(function() { controller.abort(); }, timeoutMs);
      }

      return fetch(url, opts)
        .then(function(response) {
          if (timer) clearTimeout(timer);
          if (!response.ok) throw new Error("HTTP " + response.status);
          return response.json();
        })
        .catch(function(err) {
          if (timer) clearTimeout(timer);
          if (numero >= tentativi) throw err;
          return new Promise(function(resolve) {
            setTimeout(resolve, 350 * numero);
          }).then(function() { return prova(numero + 1); });
        });
    }

    return prova(1);
  }

  /* =========================
     VERIFICA TOKEN
     ========================= */

  // verificaToken() — VERSIONE 3.0 — dati evento solo dopo token valido
  function verificaToken() {
    var risultato = document.getElementById("risultato");
    
// Loader verifica token — VERSIONE 1.0
risultato.innerHTML =
  '<div class="loader-clessidra" aria-label="Caricamento">' +
    '<div style="display:flex;flex-direction:column;align-items:center">' +
      '<div class="clessidra-animata" aria-hidden="true">' +
        '<svg viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="M10 6H54M10 74H54" stroke="#77738f" stroke-width="6" stroke-linecap="round"/>' +
          '<path d="M15 12C16 27 26 31 32 40C38 31 48 27 49 12M15 68C16 53 26 49 32 40C38 49 48 53 49 68" fill="#f8fbff" stroke="#8d88a5" stroke-width="3.8" stroke-linecap="round"/>' +
          '<path d="M21 17H43C41 27 36 32 32 36C28 32 23 27 21 17Z" fill="#d9d2f4"/>' +
          '<path d="M21 63H43C41 53 36 48 32 44C28 48 23 53 21 63Z" fill="#d9d2f4"/>' +
          '<path d="M30.5 34H33.5V48H30.5Z" fill="#d9d2f4"/>' +
        '</svg>' +
      '</div>' +
      '<div class="loader-testo">CARICAMENTO...</div>' +
    '</div>' +
  '</div>';

    fetchJsonRobusto(
      "https://partecipazione-test.rodolfo-funaro.workers.dev/",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: TOKEN }),
        cache: "no-store"
      },
      2,
      9000
    )
    .then(function(data) {
      if (data.ok !== true) {
        risultato.innerHTML = "<strong>TOKEN NON VALIDO</strong>";
        return;
      }

      var evento = data.evento || {};

      STATO_RSVP = String(data.stato || "").trim();
      PARTECIPANTI_RSVP = Number(data.partecipanti || 0);
      BAMBINI_RSVP = Number(data.bambini || 0);

      /*
        VIDEO — VERSIONE 3.0
        Il Worker 3.1 restituisce il ticket video già nella verifica iniziale.
        Nessuna seconda chiamata ad Apps Script/Worker.
      */
      VIDEO_URL_TEMPORANEO =
        (data.videoAutorizzato === true && data.videoUrl)
          ? String(data.videoUrl)
          : "";

      /*
        Anteprima solo se nella query c'è preview=1.
        Il link normale continua a mostrare la busta.
      */
      var query = new URLSearchParams(window.location.search);

      if (query.get("preview") === "1") {
        mostraAnteprimaCartoncino(evento);
      } else {
        mostraBusta(data.intestazione || "", evento);
      }
    })
    .catch(function() {
      risultato.innerHTML =
        '<div style="text-align:center;padding:28px 18px;font-family:Georgia,serif">' +
          '<strong>CONNESSIONE TEMPORANEAMENTE NON DISPONIBILE</strong><br>' +
          '<button type="button" onclick="verificaToken()" style="margin-top:18px;padding:11px 20px;border-radius:22px;border:1px solid #8a6a42;background:#fff8ec;font-weight:700;cursor:pointer">RIPROVA</button>' +
        '</div>';

  // portaVolumeMusica() — VERSIONE 1.0 — unico controller per fade-in e ducking
  function portaVolumeMusica(volumeDestinazione, durataMs) {
    var musica = document.getElementById("musicaFondo");
    if (!musica) return;

    if (TIMER_VOLUME_MUSICA) {
      clearInterval(TIMER_VOLUME_MUSICA);
      TIMER_VOLUME_MUSICA = null;
    }

    var partenza = Number(musica.volume || 0);
    var destinazione = Math.max(0, Math.min(1, Number(volumeDestinazione)));
    var durata = Math.max(0, Number(durataMs || 0));

    if (durata === 0 || Math.abs(destinazione - partenza) < 0.002) {
      musica.volume = destinazione;
      return;
    }

    var iniziato = Date.now();
    TIMER_VOLUME_MUSICA = setInterval(function() {
      var progresso = Math.min(1, (Date.now() - iniziato) / durata);
      musica.volume = partenza + (destinazione - partenza) * progresso;
      if (progresso >= 1) {
        clearInterval(TIMER_VOLUME_MUSICA);
        TIMER_VOLUME_MUSICA = null;
        musica.volume = destinazione;
      }
    }, 40);
  }

  // mostraVideoInvito() — VERSIONE 2.4 — estrazione dalla tasca + crop inferiore
  function mostraVideoInvito(videoUrl, alTermine) {
    if (!videoUrl) { alTermine(); return; }

    var busta = document.querySelector(".busta");
    if (!busta) { alTermine(); return; }

    busta.classList.add("video-in-corso");

    var pocketWindow = document.createElement("div");
    pocketWindow.className = "video-pocket-window";

    var stage = document.createElement("div");
    stage.className = "video-emergente-stage";

    var video = document.createElement("video");
    video.className = "video-invito";
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");
    video.preload = "auto";
    video.src = videoUrl;
    stage.appendChild(video);
    pocketWindow.appendChild(stage);
    busta.appendChild(pocketWindow);

    var musica = document.getElementById("musicaFondo");

    // AUDIO VIDEO — VERSIONE 1.1 — ducking sincronizzato con la riproduzione reale
    // Su iPhone il comando non viene più dato durante l'animazione di estrazione:
    // abbassiamo la musica solo quando il video entra davvero nello stato "playing".
    video.addEventListener("playing", function() {
      if (musica && !musica.paused) {
        portaVolumeMusica(VOLUME_MUSICA_VIDEO, 650);
      }
    }, { once: true });

    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        stage.classList.add("visibile");
        stage.classList.add("estratto");
      });
    });

    /*
      Finché stage è figlio della busta ha z-index 4: la tasca (z-index 5)
      copre la parte ancora interna. Solo quando il video ha superato il
      bordo superiore viene trasformato nell'elemento fixed volante.
    */
    setTimeout(function() {
      if (!stage.parentNode) return;

      var rect = stage.getBoundingClientRect();
      var volante = document.createElement("div");
      volante.className = "video-invito-volante";
      volante.style.left = rect.left + "px";
      volante.style.top = rect.top + "px";
      volante.style.width = rect.width + "px";
      volante.style.height = rect.height + "px";

      stage.removeChild(video);

      if (pocketWindow.parentNode) {
        pocketWindow.parentNode.removeChild(pocketWindow);
      }

      volante.appendChild(video);

      var salta = document.createElement("button");
      salta.type = "button";
      salta.className = "video-salta";
      salta.textContent = "SALTA VIDEO";
      volante.appendChild(salta);
      document.body.appendChild(volante);

      var rapportoVideo = 464 / 832;
      var finalHeight = Math.min(window.innerHeight * .92, 832);
      var finalWidth = finalHeight * rapportoVideo;
      if (finalWidth > window.innerWidth * .94) {
        finalWidth = window.innerWidth * .94;
        finalHeight = finalWidth / rapportoVideo;
      }
      var finalLeft = (window.innerWidth - finalWidth) / 2;
      var finalTop = (window.innerHeight - finalHeight) / 2;
      var concluso = false;

      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          volante.style.left = finalLeft + "px";
          volante.style.top = finalTop + "px";
          volante.style.width = finalWidth + "px";
          volante.style.height = finalHeight + "px";
        });
      });

      setTimeout(function() {
        volante.classList.add("arrivato");
        var avvio = video.play();
        if (avvio && typeof avvio.catch === "function") {
          avvio.catch(function() {
            /* Su mobile i controlli restano disponibili per un secondo gesto. */
            video.setAttribute("controls", "");
          });
        }
      }, 720);

      function chiudiVideo() {
        if (concluso) return;
        concluso = true;

        try { video.pause(); } catch (e) {}

        /*
          v6.9.5:
          la musica ricomincia a salire mentre il video sfuma.
          Il video non "scappa" più verso l'alto: resta centrato,
          si riduce appena e scompare in 450 ms.
        */
        if (musica && !musica.paused) {
          portaVolumeMusica(VOLUME_MUSICA_NORMALE, 900);
        }

        volante.classList.remove("arrivato");
        volante.classList.add("in-uscita");

        /*
          Quando il video è ormai quasi completamente scomparso,
          torniamo alla geometria reale della busta e facciamo uscire
          fisicamente il cartoncino dalla tasca.
        */
        setTimeout(function() {
          busta.classList.remove("video-in-corso");
          busta.classList.add("post-video-estrazione");
        }, 380);

        /*
          Attendiamo che l'estrazione fisica sia quasi conclusa;
          poi il cartoncino viene trasformato nel volante usando
          la stessa animazione finale già approvata.
        */
        setTimeout(function() {
          video.removeAttribute("src");
          try { video.load(); } catch (e) {}

          if (volante.parentNode) {
            volante.parentNode.removeChild(volante);
          }

          alTermine();

          setTimeout(function() {
            busta.classList.remove("post-video-estrazione");
          }, 80);
        }, 1080);
      }

      video.addEventListener("ended", chiudiVideo);
      video.addEventListener("error", chiudiVideo);
      salta.addEventListener("click", function(ev) { ev.stopPropagation(); chiudiVideo(); });
    }, 800);
  }

  // usaVersioneSmartphone() — VERSIONE 1.0 — telefono reale, non semplice larghezza finestra
  function usaVersioneSmartphone() {
    var coarse = false;
    try {
      coarse = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
    } catch (e) {}

    var sw = Number((window.screen && window.screen.width) || window.innerWidth || 0);
    var sh = Number((window.screen && window.screen.height) || window.innerHeight || 0);
    var latoCorto = Math.min(sw || 9999, sh || 9999);

    return coarse && latoCorto <= 600;
  }

// toggleMusica() — VERSIONE 1.1 — AUDIO OFF / AUDIO ON
function toggleMusica() {

  var musica =
    document.getElementById("musicaFondo");

  var icona =
    document.getElementById("iconaMusica");

  var testo =
    document.getElementById("testoMusica");

  if (!musica || !icona || !testo) {
    return;
  }

  if (musica.paused) {

    musica.play().then(function() {

      icona.textContent = "🔊";
      testo.textContent = "AUDIO OFF";

    }).catch(function() {
      // Non interferisce con il resto della pagina.
    });

  } else {

    musica.pause();

    icona.textContent = "🔇";
    testo.textContent = "AUDIO ON";

  }
}
    
// apriBusta() — VERSIONE 2.2 — flip 3D più morbido + animazione originale
function apriBusta() {

  var flip =
    document.getElementById("bustaFlip");

  var busta =
    document.getElementById("bustaTest");

  if (!flip || !busta) {
    return;
  }

  /*
    Evita doppi tocchi durante
    rotazione e apertura.
  */
  if (
    flip.classList.contains("in-rotazione") ||
    flip.classList.contains("rotazione-completata") ||
    busta.classList.contains("aperta")
  ) {
    return;
  }


  /*
    MUSICA DI SOTTOFONDO
    Parte sul primo gesto dell'utente.
  */
  var musica =
    document.getElementById("musicaFondo");

  if (musica) {

    // Musica — VERSIONE 1.1 — fade-in dolce
    musica.volume = 0;

    var avvio =
      musica.play();

    if (avvio !== undefined) {

      avvio.then(function() {
        portaVolumeMusica(VOLUME_MUSICA_NORMALE, 2500);
      }).catch(function() {
        // La sequenza visiva continua anche se l'audio viene bloccato.
      });

    }

  }


  /*
    FASE 1
    Rotazione 3D retro -> fronte.
  */
  flip.classList.add(
    "in-rotazione"
  );


  /*
    FASE 2
    Alla fine esatta del flip:
    - eliminiamo il retro dalla scena;
    - togliamo i transform 3D dall'antenato;
    - lasciamo visibile il fronte normale.

    In questo modo il cartoncino torna nello stesso
    contesto geometrico della versione approvata.
  */
  setTimeout(function() {

    flip.classList.remove(
      "in-rotazione"
    );

    flip.classList.add(
      "rotazione-completata"
    );


    /*
      FASE 3
      Pausa breve dopo la rotazione.
      Poi parte l'apertura originale.
    */
    setTimeout(function() {

      /* v6.9: tutti gli inviti reali sono previsti con video.
         Blocchiamo quindi il cartoncino mentre recuperiamo il ticket. */
      busta.classList.add("video-in-corso");

      busta.classList.add(
        "aperta"
      );


      /*
        VIDEO — VERSIONE 3.1
        Il ticket è già arrivato con la verifica iniziale.
        Attendiamo però che l'aletta abbia COMPLETATO la sua apertura:
        così il video esce dalla tasca senza passare dietro all'aletta.
      */
      setTimeout(function() {
        if (VIDEO_URL_TEMPORANEO) {
          mostraVideoInvito(VIDEO_URL_TEMPORANEO, function() {
            estraiCartoncinoFinale(busta);
          });
        } else {
          /* Recovery: un errore video non deve lasciare l'invito bloccato. */
          busta.classList.remove("video-in-corso");
          estraiCartoncinoFinale(busta);
        }
      }, 1050);

    }, 350);

  }, 1850);
}


// estraiCartoncinoFinaleMobile() — VERSIONE 1.0 — rotazione 90° -> verticale + fade busta
function estraiCartoncinoFinaleMobile(busta) {
  var originale = busta.querySelector(".cartoncino.cartoncino-mobile-host");
  if (!originale) return;

  var rect = originale.getBoundingClientRect();
  var volante = originale.cloneNode(true);
  volante.classList.add("cartoncino-volante");

  /*
    getBoundingClientRect() vede il cartoncino già ruotato di 90°.
    Ricostruiamo il rettangolo NON ruotato mantenendo lo stesso centro:
    così la prima immagine del clone coincide con il cartoncino nella busta.
  */
  var startW = rect.height;
  var startH = rect.width;
  var centerX = rect.left + rect.width / 2;
  var centerY = rect.top + rect.height / 2;

  volante.style.left = (centerX - startW / 2) + "px";
  volante.style.top = (centerY - startH / 2) + "px";
  volante.style.width = startW + "px";
  volante.style.height = startH + "px";
  volante.style.bottom = "auto";
  volante.style.transform = "rotate(90deg)";

  document.body.appendChild(volante);
  originale.style.visibility = "hidden";

  var viewportW = window.innerWidth;
  var viewportH = window.innerHeight;
  var rapportoMobile = 1240 / 1748;

  /* Quasi tutta la larghezza in verticale, ma senza tagliare il cartoncino. */
  var finalWidth = viewportW * 0.985;
  var finalHeight = finalWidth / rapportoMobile;
  var maxHeight = viewportH * 0.965;

  if (finalHeight > maxHeight) {
    finalHeight = maxHeight;
    finalWidth = finalHeight * rapportoMobile;
  }

  var finalLeft = (viewportW - finalWidth) / 2;
  var finalTop = (viewportH - finalHeight) / 2;

  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      volante.style.left = finalLeft + "px";
      volante.style.top = finalTop + "px";
      volante.style.width = finalWidth + "px";
      volante.style.height = finalHeight + "px";
      volante.style.transform = "rotate(0deg)";
      volante.classList.add("mobile-finale");
    });
  });

  /* La busta accompagna l'uscita e scompare solo nella fase finale. */
  setTimeout(function() {
    var scena = busta.closest ? busta.closest(".scena-busta") : null;
    if (scena) scena.classList.add("mobile-fadeout");
  }, 820);

  /*
    Da qui in poi NON ascoltiamo visualViewport/resize per lo zoom:
    Safari può quindi mantenere il pinch-to-zoom scelto dall'utente.
  */
  setTimeout(function() {
    volante.classList.add("rsvp-attivo");
  }, 1400);
}

// estraiCartoncinoFinale() — VERSIONE 2.0 — desktop invariato + ramo smartphone 7.0
function estraiCartoncinoFinale(busta) {

  if (usaVersioneSmartphone()) {
    estraiCartoncinoFinaleMobile(busta);
    return;
  }

  var originale =
    busta.querySelector(
      ".cartoncino"
    );

  if (!originale) {
    return;
  }

  var rect =
    originale.getBoundingClientRect();

  var volante =
    originale.cloneNode(true);

  volante.classList.add(
    "cartoncino-volante"
  );

  volante.style.left =
    rect.left + "px";

  volante.style.top =
    rect.top + "px";

  volante.style.width =
    rect.width + "px";

  volante.style.height =
    rect.height + "px";

  volante.style.transform =
    "none";

  document.body.appendChild(
    volante
  );

  originale.style.visibility =
    "hidden";

  // CARTONCINO FINALE — VERSIONE 1.4 — responsive a rotazione reale smartphone
  var rapporto = 1748 / 1240;

  function dimensionaCartoncinoFinale() {
    var viewport = window.visualViewport;
    var viewportWidth = viewport ? viewport.width : window.innerWidth;
    var viewportHeight = viewport ? viewport.height : window.innerHeight;
    var viewportLeft = viewport ? viewport.offsetLeft : 0;
    var viewportTop = viewport ? viewport.offsetTop : 0;

    var maxWidth = viewportWidth * 0.94;
    var maxHeight = viewportHeight * 0.88;
    var finalWidth = maxWidth;
    var finalHeight = finalWidth / rapporto;

    if (finalHeight > maxHeight) {
      finalHeight = maxHeight;
      finalWidth = finalHeight * rapporto;
    }

    volante.style.left =
      (viewportLeft + (viewportWidth - finalWidth) / 2) + "px";
    volante.style.top =
      (viewportTop + (viewportHeight - finalHeight) / 2) + "px";
    volante.style.width = finalWidth + "px";
    volante.style.height = finalHeight + "px";
  }

  requestAnimationFrame(function() {
    requestAnimationFrame(function() {

      dimensionaCartoncinoFinale();

      // Dopo l'estrazione, ogni rotazione/ridimensionamento reale del viewport
      // ricalcola dimensione e centratura senza applicare alcuna rotazione CSS.
      var resizeTimerCartoncino = null;
      function aggiornaCartoncinoDopoResize() {
        if (resizeTimerCartoncino) clearTimeout(resizeTimerCartoncino);
        resizeTimerCartoncino = setTimeout(function() {
          if (volante && volante.isConnected) dimensionaCartoncinoFinale();
        }, 80);
      }

      window.addEventListener("resize", aggiornaCartoncinoDopoResize, { passive: true });
      window.addEventListener("orientationchange", aggiornaCartoncinoDopoResize, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", aggiornaCartoncinoDopoResize, { passive: true });
        window.visualViewport.addEventListener("scroll", aggiornaCartoncinoDopoResize, { passive: true });
      }

      /* RSVP è già parte del cartoncino: abilitiamo solo l'interazione finale. */
      setTimeout(function() {
        volante.classList.add("rsvp-attivo");
      }, 1250);

    });
  });
}

    // apriModuloRSVP() — VERSIONE 1.0 — finestra RSVP completa
    function apriModuloRSVP() {

      if (document.getElementById("rsvpOverlay")) {
        return;
      }

      var overlay = document.createElement("div");
      overlay.id = "rsvpOverlay";
      overlay.className = "rsvp-overlay";

      overlay.innerHTML =
        '<div class="rsvp-modale" role="dialog" aria-modal="true" aria-labelledby="rsvpTitolo">' +
          '<button type="button" class="rsvp-chiudi" onclick="chiudiModuloRSVP()" aria-label="Chiudi">×</button>' +
          '<h2 id="rsvpTitolo" class="rsvp-titolo">R.S.V.P.</h2>' +
          '<p class="rsvp-sottotitolo">Confermateci la vostra partecipazione.</p>' +

          '<div class="rsvp-scelte">' +
            '<label class="rsvp-opzione">' +
              '<input type="radio" name="statoRsvp" value="PARTECIPERÒ" onchange="aggiornaCampiRSVP()">' +
              '<span>Parteciperò</span>' +
            '</label>' +

            '<label class="rsvp-opzione">' +
              '<input type="radio" name="statoRsvp" value="NON PARTECIPERÒ" onchange="aggiornaCampiRSVP()">' +
              '<span>Non parteciperò</span>' +
            '</label>' +

            '<label class="rsvp-opzione">' +
              '<input type="radio" name="statoRsvp" value="ANCORA NON LO SO" onchange="aggiornaCampiRSVP()">' +
              '<span>Ancora non lo so</span>' +
            '</label>' +
          '</div>' +

          '<div class="rsvp-contatori">' +
            '<div class="rsvp-campo">' +
              '<label for="rsvpPartecipanti">Partecipanti</label>' +
              '<select id="rsvpPartecipanti" onchange="aggiornaBambiniRSVP()"></select>' +
            '</div>' +

            '<div class="rsvp-campo">' +
              '<label for="rsvpBambini">di cui bambini/teenager</label>' +
              '<select id="rsvpBambini"></select>' +
            '</div>' +
          '</div>' +

          '<button id="rsvpInvia" type="button" class="rsvp-invia" onclick="inviaRSVP()">INVIA RISPOSTA</button>' +
          '<div id="rsvpMessaggio" class="rsvp-messaggio"></div>' +
        '</div>';

      document.body.appendChild(overlay);

      overlay.addEventListener("click", function(e) {
        if (e.target === overlay) {
          chiudiModuloRSVP();
        }
      });

      preparaContatoriRSVP();
      preselezionaRSVP();
      aggiornaCampiRSVP();
    }


    // chiudiModuloRSVP() — VERSIONE 1.0
    function chiudiModuloRSVP() {
      var overlay = document.getElementById("rsvpOverlay");

      if (overlay) {
        overlay.remove();
      }
    }


    // preparaContatoriRSVP() — VERSIONE 1.0 — massimo 10 invitati
    function preparaContatoriRSVP() {

      var partecipanti =
        document.getElementById("rsvpPartecipanti");

      if (!partecipanti) return;

      partecipanti.innerHTML = "";

      for (var i = 1; i <= 10; i++) {
        var opzione = document.createElement("option");
        opzione.value = String(i);
        opzione.textContent = String(i);
        partecipanti.appendChild(opzione);
      }

      partecipanti.value =
        String(
          PARTECIPANTI_RSVP >= 1 &&
          PARTECIPANTI_RSVP <= 10
            ? PARTECIPANTI_RSVP
            : 1
        );

      aggiornaBambiniRSVP();
    }


    // aggiornaBambiniRSVP() — VERSIONE 1.0
    function aggiornaBambiniRSVP() {

      var partecipanti =
        document.getElementById("rsvpPartecipanti");

      var bambini =
        document.getElementById("rsvpBambini");

      if (!partecipanti || !bambini) return;

      var totale =
        Number(partecipanti.value || 1);

      var precedente =
        Number(bambini.value || BAMBINI_RSVP || 0);

      bambini.innerHTML = "";

      for (var i = 0; i <= totale; i++) {
        var opzione = document.createElement("option");
        opzione.value = String(i);
        opzione.textContent = String(i);
        bambini.appendChild(opzione);
      }

      bambini.value =
        String(
          Math.min(
            Math.max(precedente, 0),
            totale
          )
        );
    }


    // preselezionaRSVP() — VERSIONE 1.0
    function preselezionaRSVP() {

      var radios =
        document.querySelectorAll(
          'input[name="statoRsvp"]'
        );

      for (var i = 0; i < radios.length; i++) {
        if (radios[i].value === STATO_RSVP) {
          radios[i].checked = true;
          break;
        }
      }
    }


    // aggiornaCampiRSVP() — VERSIONE 1.0
    function aggiornaCampiRSVP() {

      var selezionato =
        document.querySelector(
          'input[name="statoRsvp"]:checked'
        );

      var partecipanti =
        document.getElementById("rsvpPartecipanti");

      var bambini =
        document.getElementById("rsvpBambini");

      var abilita =
        selezionato &&
        selezionato.value === "PARTECIPERÒ";

      if (partecipanti) {
        partecipanti.disabled = !abilita;
      }

      if (bambini) {
        bambini.disabled = !abilita;
      }
    }


    // inviaRSVP() — VERSIONE 1.0 — frontend pronto per collegamento backend
    function inviaRSVP() {

      var selezionato =
        document.querySelector(
          'input[name="statoRsvp"]:checked'
        );

      var messaggio =
        document.getElementById("rsvpMessaggio");

      var pulsante =
        document.getElementById("rsvpInvia");

      if (!selezionato) {
        if (messaggio) {
          messaggio.textContent =
            "Seleziona una risposta.";
        }
        return;
      }

      var stato =
        selezionato.value;

      var partecipanti = 0;
      var bambini = 0;

      if (stato === "PARTECIPERÒ") {

        partecipanti =
          Number(
            document.getElementById(
              "rsvpPartecipanti"
            ).value || 0
          );

        bambini =
          Number(
            document.getElementById(
              "rsvpBambini"
            ).value || 0
          );

        if (
          partecipanti < 1 ||
          partecipanti > 10 ||
          bambini < 0 ||
          bambini > partecipanti
        ) {
          if (messaggio) {
            messaggio.textContent =
              "Controlla il numero di partecipanti.";
          }
          return;
        }
      }

      if (pulsante) {
        pulsante.disabled = true;
      }

      if (messaggio) {
        messaggio.textContent =
          "Invio in corso…";
      }

      fetch(
        "https://partecipazione-test.rodolfo-funaro.workers.dev/",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            azione: "salvaRSVP",
            token: TOKEN,
            stato: stato,
            partecipanti: partecipanti,
            bambini: bambini
          }),
          cache: "no-store"
        }
      )
      .then(function(response) {
        if (!response.ok) {
          throw new Error("Errore HTTP");
        }

        return response.json();
      })
      .then(function(data) {

        /*
          Nessun falso positivo:
          consideriamo salvato solo se il backend
          conferma esplicitamente rsvpSalvato:true.
        */
        if (
          data.ok !== true ||
          data.rsvpSalvato !== true
        ) {
          throw new Error(
            "Backend RSVP non ancora collegato"
          );
        }

        STATO_RSVP =
          String(data.stato || stato);

        PARTECIPANTI_RSVP =
          Number(data.partecipanti || partecipanti);

        BAMBINI_RSVP =
          Number(data.bambini || bambini);

        if (messaggio) {
          messaggio.textContent =
            "Risposta registrata. Grazie!";
        }

        if (pulsante) {
          pulsante.disabled = false;
        }

        setTimeout(function() {
          chiudiModuloRSVP();
        }, 1200);
      })
      .catch(function() {

        if (messaggio) {
          messaggio.textContent =
            "Modulo pronto: collegheremo il salvataggio al backend nel debug.";
        }

        if (pulsante) {
          pulsante.disabled = false;
        }
      });
    }


    /* =========================
       SICUREZZA TESTO
       ========================= */

    function escapeHtml(testo) {

      return String(
        testo || ""
      )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

    }
