<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Partecipazione</title>

  <style>

    /* =========================
       FONT
       ========================= */

    @font-face {
      font-family: "Parisienne";
      src:
        url("fonts/Parisienne-Regular.ttf?v=1")
        format("truetype");

      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }


    /* =========================
       PAGINA
       ========================= */

    body {
      margin: 0;

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #faf9f6;

      font-family:
        Georgia,
        "Times New Roman",
        serif;
    }


    #risultato {
      width: 100%;

      padding: 20px;

      box-sizing: border-box;
    }


    /* =========================
       SCENA BUSTA
       ========================= */

    .scena-busta {
      position: relative;

      width: min(88vw, 440px);
      height: 290px;

      margin: auto;

      perspective: 1000px;
    }


    /* =========================
       BUSTA
       ========================= */

    .busta {
      position: absolute;

      left: 0;
      bottom: 0;

      width: 100%;
      height: 245px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.42) 0%,
          rgba(255,255,255,0.12) 30%,
          rgba(238,231,218,0) 58%
        ),
        #eee7da;

      border-radius: 3px;

      border-top:
        1px solid
        rgba(255,255,255,0.75);

      border-left:
        1px solid
        rgba(255,255,255,0.55);

      box-shadow:
        18px 24px 34px
        rgba(70,58,42,0.20),

        7px 10px 14px
        rgba(70,58,42,0.10);

      cursor: pointer;

      overflow: visible;
    }


    /* Texture carta */

    .busta::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      z-index: 1;

      border-radius: 3px;

      background-image:
        repeating-radial-gradient(
          circle at 0 0,

          rgba(90,75,55,0.08) 0,

          rgba(90,75,55,0.08) 0.7px,

          transparent 0.9px,

          transparent 2.6px
        );

      opacity: 0.65;
    }


    /* =========================
       ALETTA
       ========================= */

    .aletta {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 135px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.30),
          rgba(248,243,233,0.95)
        );

      clip-path:
        polygon(
          0 0,
          100% 0,
          50% 100%
        );

      transform-origin:
        top center;

      transition:
        transform 1s ease;

      z-index: 3;
    }


    /* =========================
       SIGILLO CERALACCA
       ========================= */

    .sigillo {
      position: absolute;

      left: 50%;
      top: 108px;

      transform:
        translateX(-50%)
        rotate(-2deg);

      width: 54px;
      height: 52px;

      border-radius:
        58% 42% 63% 37% /
        46% 61% 39% 54%;

      background:
        radial-gradient(
          circle at 32% 28%,

          #a76458 0%,

          #87483f 38%,

          #70372f 70%,

          #5d2d28 100%
        );

      border:
        1px solid
        rgba(80,35,30,0.35);

      box-shadow:
        4px 6px 9px
        rgba(60,35,30,0.30),

        inset 2px 2px 3px
        rgba(255,255,255,0.13),

        inset -3px -3px 4px
        rgba(60,20,20,0.22);

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 5;
    }


    /* Bordo irregolare della ceralacca */

    .sigillo::before {
      content: "";

      position: absolute;

      inset: -3px;

      border-radius:
        41% 59% 48% 52% /
        57% 43% 62% 38%;

      background:
        #7a3e36;

      z-index: -1;

      box-shadow:
        2px 3px 4px
        rgba(55,25,22,0.20);
    }


    /* Impronta interna */

    .sigillo::after {
      content: "";

      position: absolute;

      width: 43px;
      height: 41px;

      border-radius:
        51% 49% 55% 45% /
        46% 54% 48% 52%;

      border:
        1px solid
        rgba(255,225,205,0.20);

      box-shadow:
        inset 1px 1px 2px
        rgba(255,255,255,0.10),

        inset -1px -1px 2px
        rgba(65,20,18,0.22);

      z-index: 1;
    }


    /* Iniziale nel sigillo */

    .sigillo span {
      position: relative;

      z-index: 2;

      font-family:
        "Parisienne",
        "Times New Roman",
        serif;

      font-size: 28px;
      font-weight: 400;

      color:
        rgba(232,190,175,0.88);

      text-shadow:
        1px 1px 1px
        rgba(255,255,255,0.12),

        -1px -1px 1px
        rgba(55,20,18,0.40);

      transform:
        translateY(-1px);
    }


    /* =========================
       TESTO BUSTA
       ========================= */

    .fronte-busta {
      position: absolute;

      inset: 0;

      z-index: 2;

      display: flex;

      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      padding-top: 82px;

      box-sizing: border-box;
    }


    .per {
      font-size: 13px;

      letter-spacing: 0.18em;

      text-transform: uppercase;

      margin-bottom: 8px;

      color: #8a7962;
    }


    .nome-invitato {
      font-family:
        "Parisienne",
        "Times New Roman",
        serif;

      font-size:
        clamp(
          29px,
          7vw,
          40px
        );

      font-weight: 400;

      line-height: 1.15;

      color: #493f33;

      padding:
        0 24px;
    }


    .tocca {
      position: absolute;

      bottom: -38px;

      width: 100%;

      text-align: center;

      font-size: 13px;

      letter-spacing: 0.08em;

      color: #8a8175;
    }


    /* =========================
       FUTURA APERTURA
       ========================= */

    .busta.aperta .aletta {
  transform:
    rotateX(180deg);

  background:
    linear-gradient(
      135deg,
      #e2d8c8 0%,
      #d8cbb8 55%,
      #cfc0aa 100%
    );

  filter:
  drop-shadow(
    10px 14px 9px
    rgba(70, 58, 42, 0.24)
  )
  drop-shadow(
    3px 5px 3px
    rgba(70, 58, 42, 0.12)
  );


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 480px) {

      #risultato {
        padding:
          14px;
      }

      .scena-busta {
        width:
          min(92vw, 420px);
      }

      .tocca {
        bottom:
          -34px;
      }

    }

  </style>
</head>


<body>

  <div id="risultato"></div>


  <script>

    /* =========================
       TOKEN
       ========================= */

    var TOKEN = "";


    window.onload = function() {

      var parametri =
        new URLSearchParams(
          window.location.hash.substring(1)
        );


      var tokenDaUrl =
        String(
          parametri.get("t") || ""
        ).trim();


      /*
        Se il token arriva dal link:
        1. lo memorizziamo
        2. lo togliamo dall'indirizzo
      */

      if (tokenDaUrl) {

        TOKEN =
          tokenDaUrl;


        try {

          sessionStorage.setItem(
            "tokenPartecipazione",
            TOKEN
          );


          history.replaceState(
            null,
            "",
            window.location.pathname +
            window.location.search
          );

        }

        catch (errore) {

          /*
            Se sessionStorage non funziona,
            il token resta nel fragment URL.
          */

        }

      }


      /*
        Se abbiamo fatto refresh,
        recuperiamo il token dalla sessione.
      */

      else {

        try {

          TOKEN =
            String(
              sessionStorage.getItem(
                "tokenPartecipazione"
              ) || ""
            ).trim();

        }

        catch (errore) {

          TOKEN = "";

        }

      }


      if (TOKEN) {

        verificaToken();

      }

    };


    /* =========================
       VERIFICA TOKEN
       ========================= */

    function verificaToken() {

      var risultato =
        document.getElementById(
          "risultato"
        );


      risultato.textContent =
        "Verifica in corso...";


      fetch(
        "https://partecipazione-test.rodolfo-funaro.workers.dev/",
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              token: TOKEN
            }),

          cache:
            "no-store"

        }
      )


      .then(
        function(response) {

          if (!response.ok) {

            throw new Error(
              "Errore HTTP"
            );

          }

          return response.json();

        }
      )


      .then(
        function(data) {


          /* TOKEN VALIDO */

          if (data.ok === true) {

            mostraBusta(
              data.intestazione || ""
            );

          }


          /* TOKEN NON VALIDO */

          else {

            risultato.innerHTML =
              "<strong>TOKEN NON VALIDO</strong>";

          }

        }
      )


      .catch(
        function(error) {

          risultato.innerHTML =
            "<strong>ERRORE DI COLLEGAMENTO</strong>";

        }
      );

    }


    /* =========================
       CREA BUSTA
       ========================= */

    function mostraBusta(
      intestazione
    ) {

      var risultato =
        document.getElementById(
          "risultato"
        );


      risultato.innerHTML =

        '<div class="scena-busta">' +

          '<div ' +
            'id="bustaTest" ' +
            'class="busta" ' +
            'onclick="apriBusta()">' +

            '<div class="aletta"></div>' +

            '<div class="sigillo">' +
              '<span>A</span>' +
            '</div>' +

            '<div class="fronte-busta">' +

              '<div class="per">' +
                'Per' +
              '</div>' +

              '<div class="nome-invitato">' +
                escapeHtml(
                  intestazione
                ) +
              '</div>' +

            '</div>' +

          '</div>' +

          '<div class="tocca">' +
            'TOCCA PER APRIRE' +
          '</div>' +

        '</div>';

    }


    /* =========================
       APERTURA - TEMPORANEA
       ========================= */

    function apriBusta() {

      var busta =
        document.getElementById(
          "bustaTest"
        );


      if (!busta) {

        return;

      }


      /*
        Per ora apriamo solo l'aletta.
        Nel prossimo passaggio
        inseriremo il cartoncino.
      */

      busta.classList.add(
        "aperta"
      );

    }


    /* =========================
       SICUREZZA TESTO
       ========================= */

    function escapeHtml(testo) {

      return String(
        testo || ""
      )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

    }

  </script>

</body>

</html>
