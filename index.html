<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Test Token Partecipazione</title>
</head>

<body>

  <p id="risultato"></p>


  <script>

    var TOKEN = "";

window.onload = function() {

  var parametri =
    new URLSearchParams(
      window.location.hash.substring(1)
    );

  TOKEN =
    String(
      parametri.get("t") || ""
    ).trim();

  if (TOKEN) {

    history.replaceState(
      null,
      "",
      window.location.pathname
    );

  }
if (TOKEN) {
  verificaToken();
}
};

    function verificaToken() {

      var token = TOKEN;

      var risultato =
        document
          .getElementById("risultato");

      risultato.textContent =
        "Verifica in corso...";


      fetch(
        "https://partecipazione-test.rodolfo-funaro.workers.dev/",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            token: token
          }),

          cache: "no-store"
        }
      )

      .then(function(response) {

        if (!response.ok) {
          throw new Error("Errore HTTP");
        }

        return response.json();
      })

      .then(function(data) {
       
 if (data.ok === true) {
  risultato.innerHTML =
    '<div id="bustaTest" onclick="apriBusta()" ' +
    'style="max-width:420px;margin:40px auto;padding:50px 20px;' +
    'border:1px solid #bbb;text-align:center;cursor:pointer;' +
    'font-family:Georgia,serif;">' +
      '<div style="font-size:18px;margin-bottom:15px;">Per</div>' +
      '<div style="font-size:28px;font-weight:bold;">' +
        (data.intestazione || "") +
      '</div>' +
      '<div style="margin-top:30px;font-size:14px;">Tocca per aprire</div>' +
    '</div>';
}
        else {

          risultato.innerHTML =
            "<strong>TOKEN NON VALIDO</strong>";
        }
      })

      .catch(function(error) {

    
        risultato.innerHTML =
          "<strong>ERRORE DI COLLEGAMENTO</strong>";
      });
    }
function apriBusta() {
  var busta = document.getElementById("bustaTest");

  if (!busta) return;

  busta.innerHTML =
    "<div style='font-size:26px;'>BUSTA APERTA</div>";

  busta.style.cursor = "default";
}
    
  </script>

</body>
</html>
