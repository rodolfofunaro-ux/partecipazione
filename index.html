<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Test Token Partecipazione</title>

  <style>
  @font-face {
  font-family: "Parisienne";
src: url("fonts/Parisienne-Regular.ttf?v=1") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
  
    body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #faf9f6;
    font-family: Georgia, "Times New Roman", serif;
  }

  #risultato {
    width: 100%;
    padding: 20px;
    box-sizing: border-box;
  }

  .scena-busta {
    width: min(88vw, 440px);
    height: 290px;
    margin: auto;
    position: relative;
    perspective: 1000px;
  }

  .busta {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 245px;
    background:
  linear-gradient(
    135deg,
    rgba(255,255,255,0.42) 0%,
    rgba(255,255,255,0.12) 30%,
    rgba(238,231,218,0) 58%
  ),
  #eee7da;
    border-radius: 3px;
box-shadow:
  18px 24px 34px rgba(70, 58, 42, 0.20),
  7px 10px 14px rgba(70, 58, 42, 0.10);
    cursor: pointer;
    border-top: 1px solid rgba(255,255,255,0.75);
border-left: 1px solid rgba(255,255,255,0.55);
  }
    .busta::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  border-radius: 3px;

background-image:
  repeating-radial-gradient(
    circle at 0 0,
    rgba(90, 75, 55, 0.08) 0,
    rgba(90, 75, 55, 0.08) 0.7px,
    transparent 0.9px,
    transparent 2.6px
  );

opacity: 0.65;
}

  .aletta {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 135px;
    background: #f8f3e9;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform 1s ease;
    z-index: 3;
  }

 .sigillo {
  position: absolute;
  left: 50%;
  top: 108px;
  transform: translateX(-50%) rotate(-2deg);

  width: 54px;
  height: 52px;

  border-radius:
    48% 52% 46% 54% /
    52% 47% 53% 48%;

  background:
    radial-gradient(
      circle at 32% 28%,
      #a76458 0%,
      #87483f 38%,
      #70372f 70%,
      #5d2d28 100%
    );

  box-shadow:
    4px 6px 9px rgba(60, 35, 30, 0.30),
    inset 2px 2px 3px rgba(255,255,255,0.13),
    inset -3px -3px 4px rgba(60,20,20,0.22);

  display: flex;
  align-items: center;
  justify-content: center;

  z-index: 5;

  color: rgba(245,220,200,0.78);
  font-size: 20px;

  border: 1px solid rgba(80,35,30,0.35);
}

    .sigillo::before {
  content: "";
  position: absolute;
  inset: 5px;

  border-radius:
    52% 48% 54% 46% /
    47% 53% 48% 52%;

  border: 1px solid rgba(255,225,205,0.24);

  box-shadow:
    inset 1px 1px 2px rgba(255,255,255,0.12),
    inset -1px -1px 2px rgba(70,20,20,0.18);
}
.sigillo::after {
  content: "";
  position: absolute;

  width: 44px;
  height: 42px;

  border-radius:
    46% 54% 49% 51% /
    54% 46% 52% 48%;

  box-shadow:
    0 0 0 1px rgba(80,30,25,0.16);
}
.sigillo span {
  transform: translateY(-1px);
}
  .fronte-busta {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding-top: 78px;
    box-sizing: border-box;
  }

  .per {
    font-size: 15px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 12px;
    color: #8a7962;
  }

.nome-invitato {
font-family: "Parisienne", "Times New Roman", serif;
    font-size: clamp(28px, 7vw, 38px);
    font-weight: 400;
    line-height: 1.15;
    color: #493f33;
    padding: 0 24px;
}
  }

  .tocca {
    position: absolute;
    bottom: -38px;
    width: 100%;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: #8a8175;
  }

  .busta.aperta .aletta {
    transform: rotateX(180deg);
  }
</style>
</head>

<body>

  <p id="risultato"></p>


  <script>

   var TOKEN = "";

window.onload = function() {

  var parametri =
    new URLSearchParams(
      window.location.hash.substring(1)
    );

  var tokenDaUrl =
    String(
      parametri.get("t") || ""
    ).trim();

  if (tokenDaUrl) {

    TOKEN = tokenDaUrl;

    try {
      sessionStorage.setItem(
        "tokenPartecipazione",
        TOKEN
      );

      history.replaceState(
        null,
        "",
        window.location.pathname +
        window.location.search
      );

    } catch (errore) {
      // Se sessionStorage non è disponibile,
      // lasciamo il token nell'URL.
    }

  } else {

    try {
      TOKEN =
        String(
          sessionStorage.getItem(
            "tokenPartecipazione"
          ) || ""
        ).trim();

    } catch (errore) {
      TOKEN = "";
    }

  }

  if (TOKEN) {
    verificaToken();
  }

};
    function verificaToken() {

      var token = TOKEN;

      var risultato =
        document
          .getElementById("risultato");

      risultato.textContent =
        "Verifica in corso...";


      fetch(
        "https://partecipazione-test.rodolfo-funaro.workers.dev/",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            token: token
          }),

          cache: "no-store"
        }
      )

      .then(function(response) {

        if (!response.ok) {
          throw new Error("Errore HTTP");
        }

        return response.json();
      })

      .then(function(data) {
       
if (data.ok === true) {

  risultato.innerHTML =
    '<div class="scena-busta">' +
      '<div id="bustaTest" class="busta" onclick="apriBusta()">' +
  '<div class="aletta"></div>' +
  '<div class="sigillo"><span>✦</span></div>' +
  '<div class="fronte-busta">' +
          '<div class="per">Per</div>' +
          '<div class="nome-invitato">' +
            (data.intestazione || "") +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="tocca">TOCCA PER APRIRE</div>' +
    '</div>';
}
        else {

          risultato.innerHTML =
            "<strong>TOKEN NON VALIDO</strong>";
        }
      })

      .catch(function(error) {

    
        risultato.innerHTML =
          "<strong>ERRORE DI COLLEGAMENTO</strong>";
      });
    }
function apriBusta() {
  var busta = document.getElementById("bustaTest");

  if (!busta) return;

  busta.innerHTML =
    "<div style='font-size:26px;'>BUSTA APERTA</div>";

  busta.style.cursor = "default";
}
    
  </script>

</body>
</html>
