<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Test Token Partecipazione</title>

  <style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #faf9f6;
    font-family: Georgia, "Times New Roman", serif;
  }

  #risultato {
    width: 100%;
    padding: 20px;
    box-sizing: border-box;
  }

  .scena-busta {
    width: min(88vw, 440px);
    height: 290px;
    margin: auto;
    position: relative;
    perspective: 1000px;
  }

  .busta {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 245px;
    background: #eee7da;
    border-radius: 3px;
  box-shadow:
  0 24px 35px rgba(70, 58, 42, 0.22),
  0 8px 14px rgba(70, 58, 42, 0.12);
    cursor: pointer;
  }

  .aletta {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 135px;
    background: #f8f3e9;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform 1s ease;
    z-index: 3;
  }

  .fronte-busta {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding-top: 38px;
    box-sizing: border-box;
  }

  .per {
    font-size: 15px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 12px;
    color: #8a7962;
  }

  .nome-invitato {
    font-size: clamp(25px, 7vw, 34px);
    color: #493f33;
    padding: 0 22px;
  }

  .tocca {
    position: absolute;
    bottom: -38px;
    width: 100%;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: #8a8175;
  }

  .busta.aperta .aletta {
    transform: rotateX(180deg);
  }
</style>
</head>

<body>

  <p id="risultato"></p>


  <script>

    var TOKEN = "";

window.onload = function() {

  var parametri =
    new URLSearchParams(
      window.location.hash.substring(1)
    );

  TOKEN =
    String(
      parametri.get("t") || ""
    ).trim();

  if (TOKEN) {

    history.replaceState(
      null,
      "",
      window.location.pathname
    );

  }
if (TOKEN) {
  verificaToken();
}
};

    function verificaToken() {

      var token = TOKEN;

      var risultato =
        document
          .getElementById("risultato");

      risultato.textContent =
        "Verifica in corso...";


      fetch(
        "https://partecipazione-test.rodolfo-funaro.workers.dev/",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            token: token
          }),

          cache: "no-store"
        }
      )

      .then(function(response) {

        if (!response.ok) {
          throw new Error("Errore HTTP");
        }

        return response.json();
      })

      .then(function(data) {
       
if (data.ok === true) {

  risultato.innerHTML =
    '<div class="scena-busta">' +
      '<div id="bustaTest" class="busta" onclick="apriBusta()">' +
        '<div class="aletta"></div>' +
        '<div class="fronte-busta">' +
          '<div class="per">Per</div>' +
          '<div class="nome-invitato">' +
            (data.intestazione || "") +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="tocca">TOCCA PER APRIRE</div>' +
    '</div>';
}
        else {

          risultato.innerHTML =
            "<strong>TOKEN NON VALIDO</strong>";
        }
      })

      .catch(function(error) {

    
        risultato.innerHTML =
          "<strong>ERRORE DI COLLEGAMENTO</strong>";
      });
    }
function apriBusta() {
  var busta = document.getElementById("bustaTest");

  if (!busta) return;

  busta.innerHTML =
    "<div style='font-size:26px;'>BUSTA APERTA</div>";

  busta.style.cursor = "default";
}
    
  </script>

</body>
</html>
