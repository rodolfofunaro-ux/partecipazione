<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Test Token Partecipazione</title>
</head>

<body>

  <p id="risultato"></p>


  <script>

    var TOKEN = "";

window.onload = function() {

  var parametri =
    new URLSearchParams(
      window.location.hash.substring(1)
    );

  TOKEN =
    String(
      parametri.get("t") || ""
    ).trim();

  if (TOKEN) {

    history.replaceState(
      null,
      "",
      window.location.pathname
    );

  }
if (TOKEN) {
  verificaToken();
}
};

    function verificaToken() {

      var token = TOKEN;

      var risultato =
        document
          .getElementById("risultato");

      risultato.textContent =
        "Verifica in corso...";


      fetch(
        "https://partecipazione-test.rodolfo-funaro.workers.dev/",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            token: token
          }),

          cache: "no-store"
        }
      )

      .then(function(response) {

        if (!response.ok) {
          throw new Error("Errore HTTP");
        }

        return response.json();
      })

      .then(function(data) {
       
  if (data.ok === true) {
  risultato.innerHTML =
    "<strong>TOKEN VALIDO</strong><br>" +
    (data.intestazione || "");
}
        else {

          risultato.innerHTML =
            "<strong>TOKEN NON VALIDO</strong>";
        }
      })

      .catch(function(error) {

    
        risultato.innerHTML =
          "<strong>ERRORE DI COLLEGAMENTO</strong>";
      });
    }

  </script>

</body>
</html>
