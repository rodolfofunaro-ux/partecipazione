<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Partecipazione</title>

  <style>

    /* =========================
       FONT
       ========================= */

    @font-face {
      font-family: "Parisienne";
      src:
        url("fonts/Parisienne-Regular.ttf?v=1")
        format("truetype");

      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    /* Almendra Regular — VERSIONE 1.0 */
@font-face {
  font-family: "Almendra";
  src: url("fonts/Almendra-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

    /* Amerigo Md BT Corsivo Medio — VERSIONE 1.1 — font unico dati cartoncino */
@font-face {
  font-family: "AmerigoMdBT";
  src: url("fonts/Amerigo%20Md%20BT%20Corsivo%20medio.ttf?v=1") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

    /* =========================
       PAGINA
       ========================= */

    body {
      margin: 0;

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #faf9f6;

      font-family:
        Georgia,
        "Times New Roman",
        serif;
    }


    #risultato {
      width: 100%;

      padding: 20px;

      box-sizing: border-box;
    }


    /* =========================
       SCENA BUSTA
       ========================= */

    /* scena-busta — VERSIONE 2.0 — geometria verticale corretta */
.scena-busta {
  position: relative;

  width: min(88vw, 440px);
  height: 330px;

  margin: auto;

  perspective: 1000px;
}

    /* =========================
       BUSTA
       ========================= */

    .busta {
      position: absolute;

      left: 0;
      bottom: 0;

      width: 100%;
/* busta — VERSIONE 2.0 — maggiore profondità */
height: 285px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.42) 0%,
          rgba(255,255,255,0.12) 30%,
          rgba(238,231,218,0) 58%
        ),
        #eee7da;

      border-radius: 3px;

      border-top:
        1px solid
        rgba(255,255,255,0.75);

      border-left:
        1px solid
        rgba(255,255,255,0.55);

      box-shadow:
        18px 24px 34px
        rgba(70,58,42,0.20),

        7px 10px 14px
        rgba(70,58,42,0.10);

      cursor: pointer;

      overflow: visible;
    }


    /* =========================
       ROTAZIONE 3D BUSTA
       VERSIONE 1.2
       Retro iniziale con intestazione integrata.
       A fine rotazione il wrapper 3D viene appiattito
       prima di avviare l'animazione originale.
       ========================= */

    .busta-flip {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 285px;

      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;

      transform: rotateY(0deg);

      transition:
        transform 1.85s cubic-bezier(0.20, 0.70, 0.20, 1);

      will-change: transform;

      cursor: pointer;

      user-select: none;
      -webkit-user-select: none;

      caret-color: transparent;
      outline: none;
    }

    .busta-flip.in-rotazione {
      transform: rotateY(180deg);
    }

    /*
      Dopo il flip la struttura viene resa nuovamente
      "piatta", senza alcun transform sull'antenato.
      È fondamentale per conservare identica
      l'animazione originale del cartoncino.
    */
    .busta-flip.rotazione-completata {
      transform: none !important;
      transition: none !important;
      transform-style: flat;
      -webkit-transform-style: flat;
      cursor: default;
    }

    .faccia-busta {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      border-radius: 3px;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;

      user-select: none;
      -webkit-user-select: none;

      caret-color: transparent;
    }

    /* RETRO: prima faccia visibile */
    .retro-busta {
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: center;

      box-sizing: border-box;
      padding: 28px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.42) 0%,
          rgba(255,255,255,0.12) 30%,
          rgba(238,231,218,0) 58%
        ),
        #eee7da;

      border-top: 1px solid rgba(255,255,255,0.75);
      border-left: 1px solid rgba(255,255,255,0.55);

      box-shadow:
        18px 24px 34px rgba(70,58,42,0.20),
        7px 10px 14px rgba(70,58,42,0.10);

      overflow: hidden;
    }

    .retro-busta::after {
      content: "";
      position: absolute;
      inset: 0;

      border-radius: 3px;

      background-image:
        repeating-radial-gradient(
          circle at 0 0,
          rgba(90,75,55,0.08) 0,
          rgba(90,75,55,0.08) 0.7px,
          transparent 0.9px,
          transparent 2.6px
        );

      opacity: 0.65;
      pointer-events: none;
    }

    .retro-busta .nome-invitato {
      position: relative;
      z-index: 2;

      width: 100%;
      padding: 0 18px;

      text-align: center;

      transform: translateZ(1px);

      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      caret-color: transparent;
    }

    /* FRONTE: contiene la busta originale completa */
    .fronte-flip {
      z-index: 1;

      transform: rotateY(180deg);

      overflow: visible;

      background: #eee7da;
    }

    /*
      Stato finale istantaneo:
      retro eliminato dalla scena e fronte riportato
      a orientamento normale prima dell'apertura.
    */
    .busta-flip.rotazione-completata .retro-busta {
      display: none;
    }

    .busta-flip.rotazione-completata .fronte-flip {
      transform: none !important;
      backface-visibility: visible;
      -webkit-backface-visibility: visible;
    }


    /* Texture carta */

    .busta::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      z-index: 1;

      border-radius: 3px;

      background-image:
        repeating-radial-gradient(
          circle at 0 0,

          rgba(90,75,55,0.08) 0,

          rgba(90,75,55,0.08) 0.7px,

          transparent 0.9px,

          transparent 2.6px
        );

      opacity: 0.65;
    }


    /* =========================
       ALETTA
       ========================= */

    .aletta {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 135px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.30),
          rgba(248,243,233,0.95)
        );

      clip-path:
        polygon(
          0 0,
          100% 0,
          50% 100%
        );

      transform-origin:
        top center;

      transition:
        transform 1s ease;

      z-index: 6;
    }


    /* =========================
       SIGILLO CERALACCA
       ========================= */

    .sigillo {
      position: absolute;

      left: 50%;
      top: 108px;

      transform:
        translateX(-50%)
        rotate(-2deg);

      width: 54px;
      height: 52px;

      border-radius:
        58% 42% 63% 37% /
        46% 61% 39% 54%;

      background:
        radial-gradient(
          circle at 32% 28%,

          #a76458 0%,

          #87483f 38%,

          #70372f 70%,

          #5d2d28 100%
        );

      border:
        1px solid
        rgba(80,35,30,0.35);

      box-shadow:
        4px 6px 9px
        rgba(60,35,30,0.30),

        inset 2px 2px 3px
        rgba(255,255,255,0.13),

        inset -3px -3px 4px
        rgba(60,20,20,0.22);

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 7;
    }


    /* Bordo irregolare della ceralacca */

    .sigillo::before {
      content: "";

      position: absolute;

      inset: -3px;

      border-radius:
        41% 59% 48% 52% /
        57% 43% 62% 38%;

      background:
        #7a3e36;

      z-index: -1;

      box-shadow:
        2px 3px 4px
        rgba(55,25,22,0.20);
    }


    /* Impronta interna */

    .sigillo::after {
      content: "";

      position: absolute;

      width: 43px;
      height: 41px;

      border-radius:
        51% 49% 55% 45% /
        46% 54% 48% 52%;

      border:
        1px solid
        rgba(255,225,205,0.20);

      box-shadow:
        inset 1px 1px 2px
        rgba(255,255,255,0.10),

        inset -1px -1px 2px
        rgba(65,20,18,0.22);

      z-index: 1;
    }


    /* Iniziale nel sigillo */

    .sigillo span {
      position: relative;

      z-index: 2;

      font-family:
        "Parisienne",
        "Times New Roman",
        serif;

      font-size: 28px;
      font-weight: 400;

      color:
        rgba(232,190,175,0.88);

      text-shadow:
        1px 1px 1px
        rgba(255,255,255,0.12),

        -1px -1px 1px
        rgba(55,20,18,0.40);

      transform:
        translateY(-1px);
    }


    /* =========================
       TESTO BUSTA
       ========================= */

    .fronte-busta {
      position: absolute;

      inset: 0;

      z-index: 6;

      display: flex;

      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      padding-top: 82px;

      box-sizing: border-box;
    }


    .per {
      font-size: 13px;

      letter-spacing: 0.18em;

      text-transform: uppercase;

      margin-bottom: 8px;

      color: #8a7962;
    }


/* Intestazione invitato — VERSIONE 2.0 — Amerigo Md BT */
.nome-invitato {
  font-family:
    "AmerigoMdBT",
    Georgia,
    serif;

  font-size:
    clamp(
      29px,
      7vw,
      40px
    );

  font-style: normal;
  font-weight: 400;

  line-height: 1.15;

  color: #493f33;

  padding:
    0 24px;
}


    /* =========================
       CARTONCINO COMPLETO
       VERSIONE 3.0
       Un solo SVG 1748x1240: sfondo + dati protetti.
       Tutto scala come un unico oggetto.
       ========================= */

    .cartoncino {
      position: absolute;
      left: 11%;
      bottom: 0;
      width: 78%;
      aspect-ratio: 1748 / 1240;
      height: auto;
      background: #f8f5ee;
      border-radius: 2px;
      box-shadow: 8px 10px 18px rgba(70,58,42,0.18);
      z-index: 4;
      transform: translate3d(0,0,0);
      transition: transform 2.2s cubic-bezier(0.22,0.61,0.36,1);
      will-change: transform;
      pointer-events: none;
      overflow: hidden;
    }

    .cartoncino-svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Tutti i dati sono dentro il viewBox fisso 1748x1240. */
    /* Dati cartoncino — VERSIONE 4.0 — Amerigo Md BT unico per tutti i testi dinamici */
    .dati-svg {
      box-sizing: border-box;
      color: #111;
      text-align: center;
      font-family: "AmerigoMdBT", Georgia, serif;

      font-weight: 400;

    }

    /* Shabbat — VERSIONE 1.5 — nuova posizione gestita nello SVG */

    .dati-shabbat-svg .riga2 {

      line-height: 1.12;
    }

    .dati-party-svg .intro-riga2 {

   /* Villa Cinardi — VERSIONE 1.5 — bordo nero + ombra più marcata */
.dati-party-svg .location {
  margin-top: 10px;

  font-family: "AmerigoMdBT", Georgia, serif;
  font-style: normal;

  font-weight: 400;

    .dati-party-svg .indirizzo {

    /* Contributo / pagamento — VERSIONE 1.2 — Amerigo unico */
    .dati-pagamento-svg {

      line-height: 1.12;

    .dati-pagamento-svg .paypal {

    /* Anteprima statica: usa lo stesso identico SVG della busta. */
    .anteprima-cartoncino {
      width: min(94vw, calc(88vh * 1748 / 1240));
      aspect-ratio: 1748 / 1240;
      margin: 0 auto;
      overflow: hidden;
      background: #f8f5ee;
      border-radius: 2px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.10);
    }

    .anteprima-cartoncino .cartoncino-svg {
      width: 100%;
      height: 100%;
    }

/* tasca-busta — VERSIONE 2.3 — crop esattamente sul bordo */
.tasca-busta {
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,0.42) 0%,
      rgba(255,255,255,0.12) 30%,

  z-index: 5;

}
.tasca-busta::after {
  content: "";
  position: absolute;
  inset: 0;

  background-image:
    repeating-radial-gradient(

      rgba(90,75,55,0.08) 0.7px,
      transparent 0.9px,
      transparent 2.6px

  pointer-events: none;
}

/* estrazione cartoncino — VERSIONE 2.0 — uscita completa */
.busta.aperta .cartoncino {

    translate3d(0, -290px, 0);

  transition-delay: 1.05s;
}

    .tocca {
      position: absolute;

      bottom: -38px;

      width: 100%;

      text-align: center;

      font-size: 13px;

      letter-spacing: 0.08em;

.cartoncino-volante {
  position: fixed;

  margin: 0;

    /* =========================
       FUTURA APERTURA
       ========================= */

/* aletta aperta — VERSIONE 1.2 — scende dietro dopo la rotazione */
.busta.aperta .aletta {
  background:
    linear-gradient(
      135deg,
      #e2d8c8 0%,
      #d8cbb8 55%,

@keyframes apriAletta {

 /* Pulsante musica — VERSIONE 1.2 — icona + testo */

<body>
    <!-- Musica di fondo — VERSIONE 1.0 -->
  <audio
    id="musicaFondo"

    preload="auto"
    loop>

<!-- Controllo musica — VERSIONE 1.1 -->
<button
  id="btnMusica"
  type="button"
  onclick="toggleMusica()"
  aria-label="Ferma o riattiva la musica">
  <span id="iconaMusica">🔊</span>
  <span id="testoMusica">AUDIO OFF</span>
</button>

  <div id="risultato"></div>


  <script>

    /* =========================
       TOKEN
       ========================= */

    var TOKEN = "";


    window.onload = function() {

      var parametri =
        new URLSearchParams(
          window.location.hash.substring(1)
        );


      var tokenDaUrl =
        String(
          parametri.get("t") || ""
        ).trim();


      /*
        Se il token arriva dal link:
        1. lo memorizziamo
        2. lo togliamo dall'indirizzo
      */

      if (tokenDaUrl) {

        TOKEN =
          tokenDaUrl;


        try {

          sessionStorage.setItem(
            "tokenPartecipazione",
            TOKEN
          );


          history.replaceState(
            null,
            "",
            window.location.pathname +
            window.location.search
          );

        }

        catch (errore) {

          /*
            Se sessionStorage non funziona,
            il token resta nel fragment URL.
          */

        }

      }


      /*
        Se abbiamo fatto refresh,
        recuperiamo il token dalla sessione.
      */

      else {

        try {

          TOKEN =
            String(
              sessionStorage.getItem(
                "tokenPartecipazione"
              ) || ""
            ).trim();

        }

        catch (errore) {

          TOKEN = "";

        }

      }


      if (TOKEN) {

        verificaToken();

      }

    };




  /* =========================
     VERIFICA TOKEN
     ========================= */

  // verificaToken() — VERSIONE 3.0 — dati evento solo dopo token valido
  function verificaToken() {
    var risultato = document.getElementById("risultato");
    
// Loader verifica token — VERSIONE 1.0
risultato.innerHTML =
  '<div class="loader-cuore" aria-label="Caricamento">' +
    '<div class="cuore-pulsante">♥</div>' +
  '</div>';

    fetch(
      "https://partecipazione-test.rodolfo-funaro.workers.dev/",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: TOKEN }),
        cache: "no-store"
      }
    )
    .then(function(response) {
      if (!response.ok) throw new Error("Errore HTTP");
      return response.json();
    })
    .then(function(data) {
      if (data.ok !== true) {
        risultato.innerHTML = "<strong>TOKEN NON VALIDO</strong>";
        return;
      }

      var evento = data.evento || {};

      /*
        Anteprima solo se nella query c'è preview=1.
        Il link normale continua a mostrare la busta.
      */
      var query = new URLSearchParams(window.location.search);

      if (query.get("preview") === "1") {
        mostraAnteprimaCartoncino(evento);
      } else {
        mostraBusta(data.intestazione || "", evento);
      }
    })
    .catch(function() {
      risultato.innerHTML = "<strong>ERRORE DI COLLEGAMENTO</strong>";
    });
  }

  /* =========================
     CARTONCINO COMPLETO PROTETTO
     ========================= */

  // creaCartoncinoCompleto() — VERSIONE 3.0 — SVG unico 1748x1240
  function creaCartoncinoCompleto(evento) {
    evento = evento || {};

    var NS = "http://www.w3.org/2000/svg";
    var XHTML = "http://www.w3.org/1999/xhtml";

    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "cartoncino-svg");
    svg.setAttribute("viewBox", "0 0 1748 1240");
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    svg.setAttribute("aria-label", "Partecipazione");

    var sfondo = document.createElementNS(NS, "image");
    sfondo.setAttribute("href", "cartoncino_base_web_q84.jpg");
    sfondo.setAttribute("x", "0");
    sfondo.setAttribute("y", "0");
    sfondo.setAttribute("width", "1748");
    sfondo.setAttribute("height", "1240");
    sfondo.setAttribute("preserveAspectRatio", "none");
    svg.appendChild(sfondo);

    function aggiungiBlocco(x, y, w, h, className, costruttore) {
      var fo = document.createElementNS(NS, "foreignObject");
      fo.setAttribute("x", String(x));
      fo.setAttribute("y", String(y));
      fo.setAttribute("width", String(w));
      fo.setAttribute("height", String(h));

      var div = document.createElementNS(XHTML, "div");
      div.setAttribute("class", "dati-svg " + className);
      costruttore(div);

      fo.appendChild(div);
      svg.appendChild(fo);
    }

    /* Shabbat — POSIZIONE VERSIONE 1.5 — alzato di 65 unità */
    aggiungiBlocco(28, 525, 690, 150, "dati-shabbat-svg", function(div) {
      var r1 = document.createElementNS(XHTML, "div");
      r1.textContent = evento.shabbatData || "";

      var r2 = document.createElementNS(XHTML, "div");
      r2.setAttribute("class", "riga2");
      r2.textContent =
        (evento.shabbatLuogo || "") +
        ((evento.shabbatLuogo || evento.shabbatOra) ? " - ore " : "") +
        (evento.shabbatOra || "");

      div.appendChild(r1);
      div.appendChild(r2);
    });

    /* Party — VERSIONE 1.3 — alzato di 65 unità
       I valori arrivano esclusivamente dal backend dopo token valido.
       Il testo CONFIG viene diviso graficamente prima di "domenica". */
    aggiungiBlocco(875, 525, 810, 300, "dati-party-svg", function(div) {
      var testoParty = String(evento.partyTesto || "").trim();
      var riga1Testo = testoParty;
      var riga2Testo = "";

      var puntoDomenica = testoParty.search(/\bdomenica\b/i);

      if (puntoDomenica > 0) {
        riga1Testo = testoParty.substring(0, puntoDomenica).trim();
        riga2Testo = testoParty.substring(puntoDomenica).trim();
      }

      var introRiga1 = document.createElementNS(XHTML, "div");
      introRiga1.textContent = riga1Testo;
      div.appendChild(introRiga1);

      if (riga2Testo) {
        var introRiga2 = document.createElementNS(XHTML, "div");
        introRiga2.setAttribute("class", "intro-riga2");
        introRiga2.textContent = riga2Testo;
        div.appendChild(introRiga2);
      }

      var location = document.createElementNS(XHTML, "div");
      location.setAttribute("class", "location");
      location.textContent = evento.partyLocation || "";

      var indirizzo = document.createElementNS(XHTML, "div");
      indirizzo.setAttribute("class", "indirizzo");
      indirizzo.textContent =
        (evento.partyIndirizzo || "") +
        ((evento.partyIndirizzo || evento.partyOra) ? " - ore " : "") +
        (evento.partyOra || "");

      div.appendChild(location);
      div.appendChild(indirizzo);
    });

    /* IBAN + PayPal: restano assenti dal repository, vengono creati qui in memoria. */
    aggiungiBlocco(124, 1125, 1500, 125, "dati-pagamento-svg", function(div) {
      var iban = document.createElementNS(XHTML, "div");
      iban.textContent = evento.ibanTesto || "";

      var paypal = document.createElementNS(XHTML, "div");
      paypal.setAttribute("class", "paypal");
      paypal.textContent = evento.paypalTesto || "";

      div.appendChild(iban);
      div.appendChild(paypal);
    });

    return svg;
  }

  function mostraBusta(intestazione, evento) {

// toggleMusica() — VERSIONE 1.1 — AUDIO OFF / AUDIO ON
function toggleMusica() {

  var musica =
    document.getElementById("musicaFondo");

  var icona =
    document.getElementById("iconaMusica");

  var testo =
    document.getElementById("testoMusica");

  if (!musica || !icona || !testo) {
    return;
  }

  if (musica.paused) {

    musica.play().then(function() {

      icona.textContent = "🔊";
      testo.textContent = "AUDIO OFF";

    }).catch(function() {
      // Non interferisce con il resto della pagina.
    });

  } else {

    musica.pause();

    icona.textContent = "🔇";
    testo.textContent = "AUDIO ON";

  }
}
    
// apriBusta() — VERSIONE 2.2 — flip 3D più morbido + animazione originale
function apriBusta() {

  var flip =
    document.getElementById("bustaFlip");

  var busta =
    document.getElementById("bustaTest");

  if (!flip || !busta) {
    return;
  }

  /*
    Evita doppi tocchi durante
    rotazione e apertura.
  */
  if (
    flip.classList.contains("in-rotazione") ||
    flip.classList.contains("rotazione-completata") ||
    busta.classList.contains("aperta")
  ) {
    return;
  }


  /*
    MUSICA DI SOTTOFONDO
    Parte sul primo gesto dell'utente.
  */
  var musica =
    document.getElementById("musicaFondo");

  if (musica) {

    // Musica — VERSIONE 1.1 — fade-in dolce
    musica.volume = 0;

    var avvio =
      musica.play();

    if (avvio !== undefined) {

      avvio.then(function() {

        var volumeFinale = 0.55;
        var durataFade = 2500;
        var intervallo = 50;
        var passi = durataFade / intervallo;
        var incremento = volumeFinale / passi;

        var fadeIn =
          setInterval(function() {

            var nuovoVolume =
              Math.min(
                volumeFinale,
                musica.volume + incremento
              );

            musica.volume =
              nuovoVolume;

            if (
              nuovoVolume >=
              volumeFinale
            ) {
              clearInterval(fadeIn);
            }

          }, intervallo);

      }).catch(function() {
        // La sequenza visiva continua anche se l'audio viene bloccato.
      });

    }

  }


  /*
    FASE 1
    Rotazione 3D retro -> fronte.
  */
  flip.classList.add(
    "in-rotazione"
  );


  /*
    FASE 2
    Alla fine esatta del flip:
    - eliminiamo il retro dalla scena;
    - togliamo i transform 3D dall'antenato;
    - lasciamo visibile il fronte normale.

    In questo modo il cartoncino torna nello stesso
    contesto geometrico della versione approvata.
  */
  setTimeout(function() {

    flip.classList.remove(
      "in-rotazione"
    );

    flip.classList.add(
      "rotazione-completata"
    );


    /*
      FASE 3
      Pausa breve dopo la rotazione.
      Poi parte l'apertura originale.
    */
    setTimeout(function() {

      busta.classList.add(
        "aperta"
      );


      /*
        Da qui in poi:
        animazione originale del cartoncino invariata.
      */
      setTimeout(function() {

        var originale =
          busta.querySelector(
            ".cartoncino"
          );

        if (!originale) {
          return;
        }


        var rect =
          originale.getBoundingClientRect();


        /*
          Creiamo una copia identica
          esattamente sopra l'originale.
        */
        var volante =
          originale.cloneNode(true);

        volante.classList.add(
          "cartoncino-volante"
        );

        volante.style.left =
          rect.left + "px";

        volante.style.top =
          rect.top + "px";

        volante.style.width =
          rect.width + "px";

        volante.style.height =
          rect.height + "px";

        volante.style.transform =
          "none";

        document.body.appendChild(
          volante
        );


        /*
          La copia prende il posto
          visivo dell'originale.
        */
        originale.style.visibility =
          "hidden";


        /*
          Spazio finale disponibile.
        */
        var maxWidth =
          window.innerWidth * 0.94;

        var maxHeight =
          window.innerHeight * 0.88;

        var rapporto =
          rect.width / rect.height;

        var finalWidth =
          maxWidth;

        var finalHeight =
          finalWidth / rapporto;

        if (
          finalHeight >
          maxHeight
        ) {

          finalHeight =
            maxHeight;

          finalWidth =
            finalHeight * rapporto;
        }


        /*
          Centratura nella viewport.
        */
        var finalLeft =
          (
            window.innerWidth -
            finalWidth
          ) / 2;

        var finalTop =
          (
            window.innerHeight -
            finalHeight
          ) / 2;


        /*
          Due frame separati evitano
          il salto immediato.
        */
        requestAnimationFrame(function() {

          requestAnimationFrame(function() {

            volante.style.left =
              finalLeft + "px";

            volante.style.top =
              finalTop + "px";

            volante.style.width =
              finalWidth + "px";

            volante.style.height =
              finalHeight + "px";

          });

        });

      }, 3500);

    }, 350);

  }, 1850);
}

    /* =========================
       SICUREZZA TESTO
       ========================= */

    function escapeHtml(testo) {

      return String(
        testo || ""
      )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

    }


  </script>
