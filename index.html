<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Test Token Partecipazione</title>
</head>

<body>

  <h1>Test sicurezza token</h1>

  <p>
  ccda98e359fa49a296b44d237fffb18d86d1badc6ec443cdaa58e7e24eb93f74
  </p>

  <input
    id="token"
    type="password"
    autocomplete="off"
    style="width:90%;max-width:600px;padding:10px;"
  >

  <br><br>

  <button
    type="button"
    onclick="verificaToken()"
    style="padding:10px 20px;"
  >
    VERIFICA TOKEN
  </button>

  <p id="risultato"></p>


  <script>

    function verificaToken() {

      var token =
        document
          .getElementById("token")
          .value
          .trim();

      var risultato =
        document
          .getElementById("risultato");

      risultato.textContent =
        "Verifica in corso...";


      fetch(
        "https://partecipazione-test.rodolfo-funaro.workers.dev/",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            token: token
          }),

          cache: "no-store"
        }
      )

      .then(function(response) {

        if (!response.ok) {
          throw new Error("Errore HTTP");
        }

        return response.json();
      })

      .then(function(data) {

        // Eliminiamo subito il token dal campo
        document
          .getElementById("token")
          .value = "";


        if (data.ok === true) {

          risultato.innerHTML =
            "<strong>TOKEN VALIDO</strong>";

        } else {

          risultato.innerHTML =
            "<strong>TOKEN NON VALIDO</strong>";
        }
      })

      .catch(function(error) {

        document
          .getElementById("token")
          .value = "";

        risultato.innerHTML =
          "<strong>ERRORE DI COLLEGAMENTO</strong>";
      });
    }

  </script>

</body>
</html>
